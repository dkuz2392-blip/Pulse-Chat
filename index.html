<!DOCTYPE html>
<html lang="ru" class="dark h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pulse Workspace v6.0 - Full Enterprise GitHub Edition</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: 'var(--bg-color)',
                        darkCard: 'var(--card-color)',
                        darkBorder: 'var(--border-color)',
                        primaryAccent: 'var(--accent-color)',
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome & Google Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Firebase Classic CDN (Для стабильной работы на GitHub Pages и мобильных) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --bg-color: #07090e;
            --card-color: #0e131f;
            --border-color: #1a2333;
            --accent-color: #4f46e5;
        }
        body.theme-linear { --bg-color: #090d16; --card-color: #131c2e; --border-color: #1e293b; --accent-color: #6366f1; }
        body.theme-cyber { --bg-color: #050508; --card-color: #0f1017; --border-color: #261d33; --accent-color: #a855f7; }
        body.theme-oled { --bg-color: #000000; --card-color: #0a0a0a; --border-color: #222222; --accent-color: #3b82f6; }

        body { font-family: 'Inter', sans-serif; background-color: var(--bg-color); color: #f3f4f6; transition: background-color 0.3s ease; margin: 0; padding: 0; }
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.98); } to { opacity: 1; transform: scale(1); } }
        .animate-modal { animation: fadeIn 0.2s ease forwards; }
        .admin-table-wrapper { overflow-x: auto; -webkit-overflow-scrolling: touch; width: 100%; }
    </style>
</head>
<body class="h-full flex flex-col select-none theme-linear overflow-hidden">

    <!-- AUTH SCREEN -->
    <div id="authScreen" class="fixed inset-0 z-50 bg-darkBg flex items-center justify-center p-4 overflow-y-auto">
        <div class="w-full max-w-sm bg-darkCard border border-darkBorder rounded-3xl shadow-2xl p-6 flex flex-col space-y-5 animate-modal my-auto">
            <div class="flex items-center justify-between">
                <div class="w-10 h-10 rounded-xl bg-primaryAccent/15 border border-primaryAccent/30 flex items-center justify-center text-primaryAccent text-base font-bold shadow-inner">
                    <i class="fa-solid fa-layer-group"></i>
                </div>
                <div class="flex items-center space-x-1 bg-darkBg border border-darkBorder rounded-xl p-1 text-[10px]">
                    <button type="button" onclick="setTheme('linear')" class="px-2 py-0.5 rounded-lg font-semibold text-white bg-primaryAccent transition">Linear</button>
                    <button type="button" onclick="setTheme('oled')" class="px-2 py-0.5 rounded-lg font-semibold text-slate-400 hover:text-white transition">OLED</button>
                    <button type="button" onclick="setTheme('cyber')" class="px-2 py-0.5 rounded-lg font-semibold text-slate-400 hover:text-white transition">Cyber</button>
                </div>
            </div>

            <div class="space-y-0.5">
                <h1 class="text-xl font-bold tracking-tight text-white">Pulse Workspace</h1>
                <p class="text-xs text-slate-400">Мобильная облачная среда</p>
            </div>

            <div class="flex bg-darkBg p-1 rounded-xl border border-darkBorder">
                <button type="button" id="tabLoginBtn" onclick="switchAuthTab('login')" class="flex-1 py-2 text-xs font-semibold rounded-lg bg-primaryAccent text-white shadow transition cursor-pointer">Вход</button>
                <button type="button" id="tabRegisterBtn" onclick="switchAuthTab('register')" class="flex-1 py-2 text-xs font-semibold rounded-lg text-slate-400 hover:text-white transition cursor-pointer">Регистрация</button>
            </div>

            <div id="authAlert" class="hidden p-2.5 rounded-xl bg-rose-500/10 border border-rose-500/20 text-rose-400 text-xs text-center font-medium"></div>

            <div id="loginForm" class="space-y-3">
                <div class="space-y-1">
                    <label class="text-[11px] font-medium text-slate-300">Никнейм</label>
                    <input type="text" id="loginUsername" class="w-full px-3.5 py-2.5 bg-darkBg border border-darkBorder rounded-xl text-xs text-white focus:outline-none focus:border-primaryAccent transition" placeholder="Ваш никнейм">
                </div>
                <div class="space-y-1">
                    <label class="text-[11px] font-medium text-slate-300">Пароль</label>
                    <input type="password" id="loginPassword" class="w-full px-3.5 py-2.5 bg-darkBg border border-darkBorder rounded-xl text-xs text-white focus:outline-none focus:border-primaryAccent transition" placeholder="••••••••">
                </div>
                <button type="button" onclick="handleLogin()" class="w-full py-3 bg-primaryAccent text-white rounded-xl text-xs font-semibold transition cursor-pointer shadow-lg shadow-primaryAccent/25">Войти в систему</button>
            </div>

            <div id="registerForm" class="space-y-3 hidden">
                <div class="space-y-1">
                    <label class="text-[11px] font-medium text-slate-300">Никнейм</label>
                    <input type="text" id="regUsername" class="w-full px-3.5 py-2.5 bg-darkBg border border-darkBorder rounded-xl text-xs text-white focus:outline-none focus:border-primaryAccent transition" placeholder="Придумайте никнейм">
                </div>
                <div class="space-y-1">
                    <label class="text-[11px] font-medium text-slate-300">Пароль</label>
                    <input type="password" id="regPassword" class="w-full px-3.5 py-2.5 bg-darkBg border border-darkBorder rounded-xl text-xs text-white focus:outline-none focus:border-primaryAccent transition" placeholder="••••••••">
                </div>
                <div class="space-y-1">
                    <label class="text-[11px] font-medium text-slate-300">Секретный ключ (для админа: 1488)</label>
                    <input type="password" id="regAdminKey" class="w-full px-3.5 py-2.5 bg-darkBg border border-darkBorder rounded-xl text-xs text-white focus:outline-none focus:border-primaryAccent transition" placeholder="Ключ доступа">
                </div>
                <button type="button" onclick="handleRegister()" class="w-full py-3 bg-primaryAccent text-white rounded-xl text-xs font-semibold transition cursor-pointer shadow-lg shadow-primaryAccent/25">Создать профиль</button>
            </div>
        </div>
    </div>

    <!-- MAIN APP LAYOUT -->
    <div id="mainAppContainer" class="flex-1 flex flex-col h-full overflow-hidden relative hidden">

        <!-- CONTENT AREA CONTAINER -->
        <div class="flex-1 flex flex-col overflow-hidden relative mb-16">

            <!-- 1. FEED SECTION -->
            <div id="sectionFeed" class="flex-1 flex flex-col overflow-hidden bg-darkBg h-full">
                <div class="h-14 px-4 border-b border-darkBorder bg-darkCard/80 backdrop-blur-xl flex items-center justify-between shrink-0">
                    <div class="flex items-center space-x-2.5">
                        <div class="w-8 h-8 rounded-lg bg-primaryAccent/15 text-primaryAccent flex items-center justify-center text-xs shadow-inner"><i class="fa-solid fa-newspaper"></i></div>
                        <div>
                            <h2 class="font-bold text-xs text-white">Инфопоток</h2>
                            <p class="text-[9px] text-slate-400">Публикации сети</p>
                        </div>
                    </div>
                    <div class="flex items-center gap-1.5">
                        <button type="button" onclick="openCreateStoryModal()" class="px-2.5 py-1.5 bg-darkBg border border-darkBorder text-slate-300 rounded-lg text-xs font-semibold flex items-center gap-1 cursor-pointer">
                            <i class="fa-solid fa-circle-plus text-primaryAccent"></i> Истории
                        </button>
                        <button type="button" onclick="openCreatePostModal()" class="px-3 py-1.5 bg-primaryAccent text-white rounded-lg text-xs font-semibold flex items-center gap-1 cursor-pointer shadow-md">
                            <i class="fa-solid fa-plus text-[9px]"></i> Запись
                        </button>
                    </div>
                </div>

                <div class="bg-darkCard/30 border-b border-darkBorder px-4 py-3 shrink-0">
                    <div id="storiesTray" class="flex items-center space-x-3 overflow-x-auto pb-1">
                        <div onclick="openCreateStoryModal()" class="flex flex-col items-center space-y-1 shrink-0 cursor-pointer">
                            <div class="w-12 h-12 rounded-xl bg-darkBg border-2 border-dashed border-primaryAccent/50 flex items-center justify-center text-primaryAccent"><i class="fa-solid fa-plus text-xs"></i></div>
                            <span class="text-[10px] text-slate-400">Ваша</span>
                        </div>
                    </div>
                </div>

                <div id="feedContainer" class="flex-1 overflow-y-auto p-3 space-y-3 max-w-lg mx-auto w-full"></div>
            </div>

            <!-- 2. MESSAGES SECTION -->
            <div id="sectionMessages" class="flex-1 flex overflow-hidden hidden relative h-full">
                <div id="sidebarChats" class="w-full md:w-72 bg-darkCard border-r border-darkBorder flex flex-col h-full absolute md:relative z-20 inset-y-0 left-0 transition-transform">
                    <div class="p-3 border-b border-darkBorder flex gap-1.5 shrink-0">
                        <button type="button" onclick="openAddFriendModal()" class="flex-1 py-2 bg-darkBg border border-darkBorder text-slate-300 rounded-xl text-xs font-semibold flex items-center justify-center gap-1 cursor-pointer">
                            <i class="fa-solid fa-user-plus text-primaryAccent text-[10px]"></i> <span>ЛС</span>
                        </button>
                        <button type="button" onclick="openCreateGroupModal()" class="flex-1 py-2 bg-darkBg border border-darkBorder text-slate-300 rounded-xl text-xs font-semibold flex items-center justify-center gap-1 cursor-pointer">
                            <i class="fa-solid fa-users text-primaryAccent text-[10px]"></i> <span>Группа</span>
                        </button>
                    </div>
                    <div id="chatList" class="flex-1 overflow-y-auto p-2 space-y-1"></div>
                </div>

                <div id="chatPane" class="flex-1 flex flex-col h-full bg-darkBg overflow-hidden relative z-10">
                    <div class="h-14 border-b border-darkBorder px-4 flex items-center justify-between bg-darkCard/60 backdrop-blur-xl shrink-0">
                        <div class="flex items-center space-x-2.5 overflow-hidden">
                            <button type="button" onclick="toggleMobileSidebar()" class="md:hidden w-8 h-8 rounded-lg bg-darkCard border border-darkBorder text-slate-300 flex items-center justify-center text-xs"><i class="fa-solid fa-arrow-left"></i></button>
                            <div class="overflow-hidden">
                                <h3 id="chatTitle" class="font-bold text-xs text-white truncate">Чат</h3>
                                <p id="chatStatus" class="text-[10px] text-slate-400 truncate">● Активно</p>
                            </div>
                        </div>
                        <div class="flex items-center space-x-1.5">
                            <button type="button" onclick="exportCurrentChat()" title="Экспорт" class="w-8 h-8 rounded-lg bg-darkCard border border-darkBorder text-slate-400 hover:text-primaryAccent flex items-center justify-center text-xs"><i class="fa-solid fa-download"></i></button>
                            <button type="button" onclick="deleteCurrentChat()" title="Удалить" class="w-8 h-8 rounded-lg bg-darkCard border border-darkBorder text-slate-400 hover:text-rose-400 flex items-center justify-center text-xs"><i class="fa-solid fa-trash-can"></i></button>
                        </div>
                    </div>

                    <div class="relative flex-1 flex flex-col overflow-hidden">
                        <div id="messagesContainer" class="flex-1 overflow-y-auto p-4 space-y-3"></div>
                    </div>

                    <div class="p-3 border-t border-darkBorder bg-darkCard/80 backdrop-blur-xl shrink-0">
                        <div class="flex items-center space-x-2">
                            <input type="text" id="messageInput" onkeydown="if(event.key==='Enter')sendMessage()" placeholder="Сообщение..." class="flex-1 px-3.5 py-2.5 bg-darkBg border border-darkBorder rounded-xl text-xs text-white focus:outline-none focus:border-primaryAccent">
                            <button type="button" onclick="sendMessage()" class="w-9 h-9 rounded-xl bg-primaryAccent text-white flex items-center justify-center shrink-0 cursor-pointer shadow-md"><i class="fa-solid fa-paper-plane text-xs"></i></button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 3. SETTINGS SECTION -->
            <div id="sectionSettings" class="flex-1 flex flex-col overflow-y-auto p-4 hidden max-w-lg mx-auto w-full space-y-4 h-full">
                <div class="flex items-center justify-between border-b border-darkBorder pb-4">
                    <div>
                        <h2 id="settingsUserName" class="font-bold text-sm text-white">Профиль</h2>
                        <button type="button" onclick="copyMyCode()" id="settingsUserCode" class="text-[11px] text-primaryAccent hover:underline font-mono">#id</button>
                    </div>
                    <button type="button" onclick="logout()" class="px-3.5 py-2 bg-rose-500/10 text-rose-400 border border-rose-500/20 rounded-xl text-xs font-semibold cursor-pointer">Выйти</button>
                </div>

                <div class="bg-darkCard border border-darkBorder rounded-2xl p-4 space-y-3 shadow-lg">
                    <h3 class="font-bold text-xs text-white uppercase">Тема оформления</h3>
                    <div class="grid grid-cols-3 gap-2">
                        <button type="button" onclick="setTheme('linear')" class="p-2.5 bg-darkBg border border-darkBorder rounded-xl text-xs text-slate-200">Linear</button>
                        <button type="button" onclick="setTheme('oled')" class="p-2.5 bg-darkBg border border-darkBorder rounded-xl text-xs text-slate-200">OLED</button>
                        <button type="button" onclick="setTheme('cyber')" class="p-2.5 bg-darkBg border border-darkBorder rounded-xl text-xs text-slate-200">Cyber</button>
                    </div>
                </div>

                <!-- ADMIN PANEL -->
                <div id="adminPanelBox" class="hidden space-y-3 pb-8">
                    <div class="bg-darkCard border border-darkBorder rounded-2xl p-4 space-y-4 shadow-lg">
                        <h3 class="font-bold text-xs text-amber-400 uppercase flex items-center gap-1.5">
                            <i class="fa-solid fa-shield-halved"></i> Панель администратора
                        </h3>
                        <div class="admin-table-wrapper border border-darkBorder rounded-xl bg-darkBg overflow-visible">
                            <table class="w-full text-left border-collapse text-xs min-w-[400px]">
                                <thead>
                                    <tr class="border-b border-darkBorder bg-darkCard/50 text-slate-400">
                                        <th class="p-3">Пользователь</th>
                                        <th class="p-3">Статус</th>
                                    </tr>
                                </thead>
                                <tbody id="adminUsersTableBody" class="divide-y divide-darkBorder"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>

        </div>

        <!-- FIXED BOTTOM NAVIGATION BAR -->
        <div class="absolute bottom-0 inset-x-0 h-16 bg-darkCard/95 border-t border-darkBorder flex items-center justify-around px-2 z-40 shadow-2xl backdrop-blur-xl">
            <button type="button" onclick="switchSection('feed')" id="navBtnFeed" class="flex-1 flex flex-col items-center justify-center py-1 text-primaryAccent transition cursor-pointer"><i class="fa-solid fa-newspaper text-sm mb-0.5"></i><span class="text-[10px] font-semibold">Лента</span></button>
            <button type="button" onclick="switchSection('messages')" id="navBtnMessages" class="flex-1 flex flex-col items-center justify-center py-1 text-slate-400 hover:text-slate-200 transition cursor-pointer"><i class="fa-solid fa-comments text-sm mb-0.5"></i><span class="text-[10px] font-semibold">Чаты</span></button>
            <button type="button" onclick="switchSection('settings')" id="navBtnSettings" class="flex-1 flex flex-col items-center justify-center py-1 text-slate-400 hover:text-slate-200 transition cursor-pointer"><i class="fa-solid fa-gear text-sm mb-0.5"></i><span class="text-[10px] font-semibold">Профиль</span></button>
        </div>
    </div>

    <!-- MODALS -->
    <div id="createPostModal" class="hidden fixed inset-0 z-50 bg-black/75 backdrop-blur-md flex items-center justify-center p-4">
        <div class="w-full max-w-sm bg-darkCard border border-darkBorder rounded-2xl shadow-2xl p-5 space-y-3 animate-modal">
            <div class="flex justify-between items-center border-b border-darkBorder pb-2.5">
                <h3 class="font-bold text-xs text-white">Новая публикация</h3>
                <button type="button" onclick="closeCreatePostModal()" class="text-slate-400"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <textarea id="postTextInput" rows="3" placeholder="Что нового?..." class="w-full p-3 bg-darkBg border border-darkBorder rounded-xl text-xs text-white focus:outline-none focus:border-primaryAccent resize-none"></textarea>
            <button type="button" onclick="submitPost()" class="w-full py-2.5 bg-primaryAccent text-white rounded-xl text-xs font-semibold">Опубликовать</button>
        </div>
    </div>

    <div id="createStoryModal" class="hidden fixed inset-0 z-50 bg-black/75 backdrop-blur-md flex items-center justify-center p-4">
        <div class="w-full max-w-sm bg-darkCard border border-darkBorder rounded-2xl shadow-2xl p-5 space-y-3 animate-modal">
            <div class="flex justify-between items-center border-b border-darkBorder pb-2.5">
                <h3 class="font-bold text-xs text-white">Добавить историю</h3>
                <button type="button" onclick="closeCreateStoryModal()" class="text-slate-400"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <input type="text" id="storyTextInput" placeholder="Текст истории..." class="w-full px-3.5 py-2.5 bg-darkBg border border-darkBorder rounded-xl text-xs text-white">
            <button type="button" onclick="submitStory()" class="w-full py-2.5 bg-primaryAccent text-white rounded-xl text-xs font-semibold">Опубликовать</button>
        </div>
    </div>

    <div id="addFriendModal" class="hidden fixed inset-0 z-50 bg-black/75 backdrop-blur-md flex items-center justify-center p-4">
        <div class="w-full max-w-xs bg-darkCard border border-darkBorder rounded-2xl shadow-2xl p-5 space-y-3 animate-modal">
            <div class="flex justify-between items-center"><h3 class="font-bold text-xs text-white">Новый ЛС чат</h3><button type="button" onclick="closeAddFriendModal()" class="text-slate-400"><i class="fa-solid fa-xmark"></i></button></div>
            <input type="text" id="friendCodeInput" placeholder="Имя собеседника" class="w-full px-3.5 py-2.5 bg-darkBg border border-darkBorder rounded-xl text-xs text-white">
            <button type="button" onclick="handleAddFriend()" class="w-full py-2.5 bg-primaryAccent text-white rounded-xl text-xs font-semibold">Открыть чат</button>
        </div>
    </div>

    <div id="createGroupModal" class="hidden fixed inset-0 z-50 bg-black/75 backdrop-blur-md flex items-center justify-center p-4">
        <div class="w-full max-w-xs bg-darkCard border border-darkBorder rounded-2xl shadow-2xl p-5 space-y-3 animate-modal">
            <div class="flex justify-between items-center"><h3 class="font-bold text-xs text-white">Создать группу</h3><button type="button" onclick="closeCreateGroupModal()" class="text-slate-400"><i class="fa-solid fa-xmark"></i></button></div>
            <input type="text" id="groupNameInput" placeholder="Название группы" class="w-full px-3.5 py-2.5 bg-darkBg border border-darkBorder rounded-xl text-xs text-white">
            <button type="button" onclick="handleCreateGroup()" class="w-full py-2.5 bg-primaryAccent text-white rounded-xl text-xs font-semibold">Создать</button>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyB1LB4QtDcDJtjElu7Uqy0f3cql66NMgAE",
            authDomain: "pulse-chat-c7c98.firebaseapp.com",
            projectId: "pulse-chat-c7c98",
            storageBucket: "pulse-chat-c7c98.firebasestorage.app",
            messagingSenderId: "308291242163",
            appId: "1:308291242163:web:df36477f216df9971208c6"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        window.CREATOR_KEY = "67";      
        window.MASTER_ADMIN_KEY = "1488"; 
        window.currentUser = null;
        window.activeChatId = 'pulse_bot';

        window.chats = JSON.parse(localStorage.getItem('pulse_chat_chats') || 'null') || [
            { id: 'pulse_bot', name: 'ИИ Ассистент', type: 'friend', messages: [{ sender: 'Ассистент', text: 'Добро пожаловать в Pulse Workspace!', time: '12:00' }] }
        ];

        window.setTheme = function(theme) {
            document.body.className = document.body.className.replace(/theme-\w+/g, '');
            document.body.classList.add('theme-' + theme);
            localStorage.setItem('pulse_theme', theme);
        };
        const savedTheme = localStorage.getItem('pulse_theme');
        if (savedTheme) window.setTheme(savedTheme);

        window.addEventListener('DOMContentLoaded', () => {
            const session = localStorage.getItem('pulse_session');
            if (session) {
                try { initSession(JSON.parse(session)); } catch(e) { localStorage.removeItem('pulse_session'); }
            }
        });

        window.switchAuthTab = function(tab) {
            document.getElementById('loginForm').classList.toggle('hidden', tab !== 'login');
            document.getElementById('registerForm').classList.toggle('hidden', tab !== 'register');
            document.getElementById('tabLoginBtn').className = `flex-1 py-2 text-xs font-semibold rounded-lg ${tab==='login'?'bg-primaryAccent text-white shadow':'text-slate-400'}`;
            document.getElementById('tabRegisterBtn').className = `flex-1 py-2 text-xs font-semibold rounded-lg ${tab==='register'?'bg-primaryAccent text-white shadow':'text-slate-400'}`;
        };

        window.handleLogin = async function() {
            const username = document.getElementById('loginUsername').value.trim().toLowerCase();
            const password = document.getElementById('loginPassword').value;
            if (!username || !password) { showAlert('Заполните поля'); return; }
            try {
                const docSnap = await db.collection('users').doc(username).get();
                if (docSnap.exists && docSnap.data().password === password) {
                    initSession(docSnap.data());
                } else { showAlert('Неверный логин или пароль'); }
            } catch(e) { showAlert('Ошибка сети'); }
        };

        window.handleRegister = async function() {
            const username = document.getElementById('regUsername').value.trim().toLowerCase();
            const password = document.getElementById('regPassword').value;
            const key = document.getElementById('regAdminKey').value.trim();
            if (!username || !password) { showAlert('Заполните обязательные поля'); return; }
            try {
                const isCreator = key === window.CREATOR_KEY;
                const isAdmin = key === window.MASTER_ADMIN_KEY || isCreator;
                const newUser = { name: username, code: '#' + username + '_123', password, isCreator, isAdmin };
                await db.collection('users').doc(username).set(newUser);
                initSession(newUser);
            } catch(e) { showAlert('Ошибка регистрации'); }
        };

        function initSession(user) {
            window.currentUser = user;
            localStorage.setItem('pulse_session', JSON.stringify(user));
            document.getElementById('authScreen').classList.add('hidden');
            document.getElementById('mainAppContainer').classList.remove('hidden');
            document.getElementById('settingsUserName').innerText = user.name;
            document.getElementById('settingsUserCode').innerText = user.code || '#usr';
            document.getElementById('adminPanelBox').classList.toggle('hidden', !user.isAdmin && !user.isCreator);
            window.renderChats();
            window.selectChat(window.activeChatId);
            subscribeToFeed();
            subscribeToStories();
        }

        window.logout = function() { localStorage.removeItem('pulse_session'); location.reload(); };

        window.switchSection = function(section) {
            ['sectionFeed', 'sectionMessages', 'sectionSettings'].forEach(s => document.getElementById(s).classList.add('hidden'));
            ['navBtnFeed', 'navBtnMessages', 'navBtnSettings'].forEach(b => document.getElementById(b).className = "flex-1 flex flex-col items-center justify-center py-1 text-slate-400 hover:text-slate-200 transition cursor-pointer");

            if (section === 'feed') { document.getElementById('sectionFeed').classList.remove('hidden'); document.getElementById('navBtnFeed').className = "flex-1 flex flex-col items-center justify-center py-1 text-primaryAccent transition cursor-pointer"; }
            else if (section === 'messages') { document.getElementById('sectionMessages').classList.remove('hidden'); document.getElementById('navBtnMessages').className = "flex-1 flex flex-col items-center justify-center py-1 text-primaryAccent transition cursor-pointer"; window.renderChats(); }
            else if (section === 'settings') { document.getElementById('sectionSettings').classList.remove('hidden'); document.getElementById('navBtnSettings').className = "flex-1 flex flex-col items-center justify-center py-1 text-primaryAccent transition cursor-pointer"; if (window.currentUser?.isAdmin || window.currentUser?.isCreator) loadAdminUsers(); }
        };

        window.toggleMobileSidebar = function() { document.getElementById('sidebarChats').classList.toggle('-translate-x-full'); };

        window.openCreatePostModal = () => document.getElementById('createPostModal').classList.remove('hidden');
        window.closeCreatePostModal = () => document.getElementById('createPostModal').classList.add('hidden');
        window.submitPost = async function() {
            const text = document.getElementById('postTextInput').value.trim();
            if (!text) return;
            await db.collection('posts').add({ author: window.currentUser.name, text, time: new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}), timestamp: firebase.firestore.FieldValue.serverTimestamp() });
            document.getElementById('postTextInput').value = ''; closeCreatePostModal();
        };

        function subscribeToFeed() {
            db.collection('posts').orderBy('timestamp', 'desc').onSnapshot(snapshot => {
                const container = document.getElementById('feedContainer');
                if (!container) return;
                container.innerHTML = '';
                snapshot.forEach(doc => {
                    const p = doc.data();
                    const card = document.createElement('div');
                    card.className = 'bg-darkCard border border-darkBorder rounded-2xl p-4 space-y-2 shadow-lg';
                    card.innerHTML = `<div class="flex items-center space-x-2.5"><div class="w-8 h-8 rounded-xl bg-darkBg border border-darkBorder text-primaryAccent font-bold flex items-center justify-center text-xs">U</div><div><h4 class="font-bold text-xs text-white">${p.author}</h4><span class="text-[10px] text-slate-500">${p.time||''}</span></div></div><p class="text-xs text-slate-200">${p.text}</p>`;
                    container.appendChild(card);
                });
            });
        }

        window.openCreateStoryModal = () => document.getElementById('createStoryModal').classList.remove('hidden');
        window.closeCreateStoryModal = () => document.getElementById('createStoryModal').classList.add('hidden');
        window.submitStory = async function() {
            const text = document.getElementById('storyTextInput').value.trim();
            if (!text) return;
            await db.collection('stories').add({ author: window.currentUser.name, text, timestamp: Date.now() });
            document.getElementById('storyTextInput').value = ''; closeCreateStoryModal();
        };

        function subscribeToStories() {
            db.collection('stories').onSnapshot(snapshot => {
                const tray = document.getElementById('storiesTray');
                if (!tray) return;
                let addBtn = tray.firstElementChild.outerHTML;
                tray.innerHTML = addBtn;
                snapshot.forEach(doc => {
                    const s = doc.data();
                    if (Date.now() - s.timestamp > 86400000) return;
                    const div = document.createElement('div');
                    div.className = 'flex flex-col items-center space-y-1 shrink-0';
                    div.innerHTML = `<div class="w-12 h-12 rounded-xl p-0.5 bg-gradient-to-tr from-primaryAccent to-indigo-500 flex items-center justify-center"><div class="w-full h-full bg-darkBg rounded-[10px] flex items-center justify-center font-bold text-[10px] text-white">U</div></div><span class="text-[10px] text-slate-300 truncate max-w-[48px]">${s.author}</span>`;
                    tray.appendChild(div);
                });
            });
        }

        window.renderChats = function() {
            const list = document.getElementById('chatList');
            if (!list) return;
            list.innerHTML = '';
            window.chats.forEach(c => {
                const item = document.createElement('div');
                item.className = 'p-3 rounded-xl cursor-pointer transition flex items-center space-x-2 bg-darkBg border border-darkBorder text-white text-xs font-semibold';
                item.innerText = c.name;
                item.onclick = () => { window.selectChat(c.id); if(window.innerWidth < 768) toggleMobileSidebar(); };
                list.appendChild(item);
            });
        };

        window.selectChat = function(id) {
            window.activeChatId = id;
            const chat = window.chats.find(c => c.id === id);
            if (!chat) return;
            document.getElementById('chatTitle').innerText = chat.name;
            window.renderMessages();
        };

        window.sendMessage = function() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            if (!text) return;
            const chat = window.chats.find(c => c.id === window.activeChatId);
            if (!chat) return;
            chat.messages.push({ sender: window.currentUser.name, text, time: new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) });
            localStorage.setItem('pulse_chat_chats', JSON.stringify(window.chats));
            window.renderMessages(); input.value = '';
            if (chat.id === 'pulse_bot') setTimeout(() => {
                chat.messages.push({ sender: 'Ассистент', text: 'Эхо: ' + text, time: new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) });
                window.renderMessages();
            }, 400);
        };

        window.renderMessages = function() {
            const container = document.getElementById('messagesContainer');
            if (!container) return;
            container.innerHTML = '';
            const chat = window.chats.find(c => c.id === window.activeChatId);
            if (!chat || !chat.messages) return;
            chat.messages.forEach(m => {
                const isMe = m.sender === window.currentUser?.name;
                const div = document.createElement('div');
                div.className = `flex flex-col ${isMe ? 'items-end' : 'items-start'}`;
                div.innerHTML = `<div class="max-w-[75%] px-3.5 py-2 rounded-xl text-xs ${isMe ? 'bg-primaryAccent text-white' : 'bg-darkCard text-slate-200 border border-darkBorder'}"><b>${m.sender}</b>: ${m.text}</div>`;
                container.appendChild(div);
            });
            container.scrollTop = container.scrollHeight;
        };

        window.openAddFriendModal = () => document.getElementById('addFriendModal').classList.remove('hidden');
        window.closeAddFriendModal = () => document.getElementById('addFriendModal').classList.add('hidden');
        window.handleAddFriend = function() {
            const name = document.getElementById('friendCodeInput').value.trim();
            if (!name) return;
            window.chats.push({ id: 'chat_'+Date.now(), name, type: 'friend', messages: [] });
            window.renderChats(); closeAddFriendModal();
        };

        window.openCreateGroupModal = () => document.getElementById('createGroupModal').classList.remove('hidden');
        window.closeCreateGroupModal = () => document.getElementById('createGroupModal').classList.add('hidden');
        window.handleCreateGroup = function() {
            const name = document.getElementById('groupNameInput').value.trim();
            if (!name) return;
            const g = { id: 'grp_'+Date.now(), name, type: 'group', messages: [] };
            window.chats.push(g); window.selectChat(g.id); window.renderChats(); closeCreateGroupModal();
        };

        window.deleteCurrentChat = function() {
            if (window.activeChatId === 'pulse_bot') return;
            window.chats = window.chats.filter(c => c.id !== window.activeChatId);
            window.selectChat('pulse_bot'); window.renderChats();
        };

        window.loadAdminUsers = async function() {
            const tbody = document.getElementById('adminUsersTableBody');
            if (!tbody) return;
            const snapshot = await db.collection('users').get();
            tbody.innerHTML = '';
            snapshot.forEach(doc => {
                const u = doc.data();
                const tr = document.createElement('tr');
                tr.innerHTML = `<td class="p-3 text-white">${u.name}</td><td class="p-3 text-emerald-400">Активен</td>`;
                tbody.appendChild(tr);
            });
        };

        window.copyMyCode = () => { navigator.clipboard.writeText(window.currentUser.code); alert('ID скопирован!'); };
        function showAlert(msg) { const a = document.getElementById('authAlert'); a.innerText = msg; a.classList.remove('hidden'); }
    </script>
</body>
</html>
