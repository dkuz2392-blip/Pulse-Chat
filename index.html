<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Pulse AI офлайн</title>
<style>
:root{--bg:#090a14;--cd:#12141f;--cd2:#191c2a;--bd:#232738;--ac:#8b5cf6;--ac2:#6366f1;--tx:#f1f5f9;--mu:#8791a7}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;width:100%;min-height:100dvh}
button,select,textarea{font:inherit;color:inherit}
button,select{background:var(--cd2);border:1px solid var(--bd);border-radius:12px;padding:11px 14px;cursor:pointer}
button:active{transform:scale(.97)}button:disabled{opacity:.5}
.btn{background:linear-gradient(135deg,var(--ac),var(--ac2));border:0;font-weight:700;color:#fff}
header{padding:12px 14px;border-bottom:1px solid var(--bd);background:var(--cd);display:grid;gap:8px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>*{min-width:0}.grow{flex:1 1 140px}
h1{margin:0;font-size:19px}
.badge{font-size:12px;padding:3px 9px;border-radius:99px;background:var(--cd2);border:1px solid var(--bd);color:var(--mu)}
.badge.off{color:#34d399;border-color:#34d39966}
#st{font-size:13px;color:var(--mu);min-height:18px}
progress{width:100%;height:8px;accent-color:var(--ac)}
#log{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:8px}
.m{max-width:90%;padding:10px 14px;border-radius:16px;white-space:pre-wrap;word-break:break-word;background:var(--cd);border:1px solid var(--bd)}
.m.u{align-self:flex-end;background:linear-gradient(135deg,var(--ac),var(--ac2));border:0;color:#fff}
.empty{margin:auto;text-align:center;color:var(--mu);padding:24px}
form{display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--bd);background:var(--cd)}
textarea{flex:1;resize:none;max-height:120px;background:var(--cd2);border:1px solid var(--bd);border-radius:16px;padding:11px 14px;outline:0;font-size:16px}
textarea:focus{border-color:var(--ac)}
</style></head>
<body>
<header>
 <div class="row"><h1 class="grow">⚡ Pulse AI</h1><span id="net" class="badge">онлайн</span><span id="mode" class="badge">проверка…</span></div>
 <div class="row">
  <select id="model" class="grow"></select>
  <button id="load" class="btn">Загрузить</button>
  <button id="clear" type="button">Очистить</button>
 </div>
 <progress id="pg" max="1" value="0" hidden></progress>
 <div id="st">Нажмите «Загрузить». Первый раз нужен интернет, потом модель работает без сети.</div>
</header>
<div id="log"><div class="empty">Здесь появится диалог.<br>Модель работает на вашем устройстве, тексты никуда не отправляются.</div></div>
<form id="f">
 <textarea id="in" rows="1" placeholder="Сообщение"></textarea>
 <button id="go" class="btn" type="submit">➤</button>
</form>

<script type="module">
const $=i=>document.getElementById(i);
const WL='https://cdn.jsdelivr.net/npm/@mlc-ai/web-llm@0.2/+esm';
const TJ='https://cdn.jsdelivr.net/npm/@huggingface/transformers@3/+esm';
const MODELS={
 gpu:[['Qwen2.5-0.5B-Instruct-q4f16_1-MLC','Лёгкая 0.5B (~400 МБ)'],['Qwen2.5-1.5B-Instruct-q4f16_1-MLC','Средняя 1.5B (~1 ГБ)'],['Qwen2.5-3B-Instruct-q4f16_1-MLC','Умная 3B (~2 ГБ)']],
 wasm:[['onnx-community/Qwen2.5-0.5B-Instruct','Лёгкая 0.5B (~500 МБ)'],['onnx-community/Qwen2.5-1.5B-Instruct','Средняя 1.5B (~1.3 ГБ, медленно)']]
};
const SYS='Ты — Pulse AI, дружелюбный помощник. Отвечай по-русски, кратко и по делу. Если не уверен, так и скажи.';
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let mode='wasm',eng=null,busy=false,loading=false,webEngine=null,hist=[];
try{hist=JSON.parse(store.get('pai_hist')||'[]')}catch(e){}
const st=t=>{$('st').textContent=t};
const net=()=>{const o=navigator.onLine;$('net').textContent=o?'онлайн':'офлайн';$('net').className='badge'+(o?'':' off')};
addEventListener('online',net);addEventListener('offline',net);net();

function add(cls,text){const l=$('log');const e=l.querySelector('.empty');if(e)e.remove();const d=document.createElement('div');d.className='m '+cls;d.textContent=text;l.append(d);l.scrollTop=l.scrollHeight;return d}
hist.forEach(m=>add(m.role==='user'?'u':'a',m.content));
const save=()=>store.set('pai_hist',JSON.stringify(hist.slice(-40)));

function fill(){
 const s=$('model');s.replaceChildren();
 MODELS[mode].forEach(([v,t])=>{const o=document.createElement('option');o.value=v;o.textContent=t;s.append(o)});
 const sv=store.get('pai_model_'+mode);if(sv&&MODELS[mode].some(m=>m[0]===sv))s.value=sv;
}
(async()=>{
 let ok=false;try{ok=!!(navigator.gpu&&await navigator.gpu.requestAdapter())}catch(e){}
 mode=ok?'gpu':'wasm';fill();
 $('mode').textContent=ok?'WebGPU (быстро)':'WASM (медленно)';
 if(!isSecureContext)st('Внимание: страница открыта не по https. Модель не сохранится для офлайна. Откройте сайт через https в Chrome.');
})();

async function load(){
 if(loading)return;
 loading=true;$('load').disabled=true;$('pg').hidden=false;$('pg').value=0;
 const id=$('model').value;
 try{
  st('Подключаю движок...');
  if(mode==='gpu'){
   const lib=await import(WL);
   if(webEngine){await webEngine.unload();webEngine=null}
   webEngine=await lib.CreateMLCEngine(id,{initProgressCallback:r=>{$('pg').value=r.progress||0;st(r.text||'Загрузка...')}});
   const w=webEngine;
   eng={stop:()=>w.interruptGenerate(),run:async(msgs,on)=>{
    const it=await w.chat.completions.create({messages:msgs,stream:true,temperature:.7,max_tokens:700});
    for await(const c of it)on((c.choices[0]&&c.choices[0].delta&&c.choices[0].delta.content)||'')}};
  }else{
   const T=await import(TJ);
   const gen=await T.pipeline('text-generation',id,{dtype:'q4',device:'wasm',progress_callback:p=>{
    if(p.status==='progress'){$('pg').value=(p.progress||0)/100;st('Скачиваю '+(p.file||'')+' '+Math.round(p.progress||0)+'%')}
    else if(p.status==='ready')st('Запускаю модель...')}});
   let sc=null;
   eng={stop:()=>{if(sc)sc.interrupt()},run:async(msgs,on)=>{
    sc=new T.InterruptableStoppingCriteria();
    const s=new T.TextStreamer(gen.tokenizer,{skip_prompt:true,skip_special_tokens:true,callback_function:on});
    await gen(msgs,{max_new_tokens:400,do_sample:true,temperature:.7,streamer:s,stopping_criteria:sc})}};
  }
  store.set('pai_model_'+mode,id);
  st('Готово. Пишите. Интернет больше не нужен.');
  $('in').focus();
 }catch(e){eng=null;st('Ошибка загрузки: '+(e&&e.message||e)+(navigator.onLine?'':' (нет интернета: движок или модель ещё не скачаны)'))}
 $('pg').hidden=true;$('load').disabled=false;loading=false;
}
$('load').onclick=load;

$('f').onsubmit=async ev=>{
 ev.preventDefault();
 if(busy){if(eng)eng.stop();return}
 const q=$('in').value.trim();if(!q)return;
 if(!eng){add('u',q);$('in').value='';add('a',loading?'Модель ещё загружается, подождите.':'Сначала нажмите «Загрузить» вверху, потом отправьте вопрос.');return}
 $('in').value='';busy=true;$('go').textContent='■';
 add('u',q);const out=add('a','...');
 let acc='';
 try{
  await eng.run([{role:'system',content:SYS},...hist.slice(-8),{role:'user',content:q}],t=>{
   acc+=t;out.textContent=acc||'...';$('log').scrollTop=$('log').scrollHeight});
 }catch(e){acc=acc||('Ошибка: '+(e&&e.message||e));out.textContent=acc}
 if(acc&&!acc.startsWith('Ошибка')){hist.push({role:'user',content:q},{role:'assistant',content:acc});save()}
 busy=false;$('go').textContent='➤';$('in').focus();
};
$('in').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&matchMedia('(min-width:700px)').matches){e.preventDefault();$('f').requestSubmit()}});
$('clear').onclick=()=>{if(busy&&eng)eng.stop();hist=[];save();$('log').innerHTML='<div class="empty">Диалог очищен.</div>'};

if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body></html>
