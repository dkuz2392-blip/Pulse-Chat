<!DOCTYPE html>
<html lang="ru" class="dark h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pulse v4.5 Enterprise Ultimate Edition</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#090d16',
                        darkCard: '#131c2e',
                        darkBorder: '#1e293b',
                        primaryAccent: '#6366f1',
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome & Google Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; touch-action: manipulation; background-color: #090d16; color: #f1f5f9; }
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
        button, input, textarea { -webkit-appearance: none; }
        .msg-group:hover .msg-actions { opacity: 1; }
        @keyframes pulseGlow { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
        .animate-glow { animation: pulseGlow 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
    </style>
</head>
<body class="h-full overflow-hidden flex flex-col select-none">

    <!-- AUTH SCREEN -->
    <div id="authScreen" class="fixed inset-0 z-50 bg-[#090d16] flex items-center justify-center p-4">
        <div class="w-full max-w-md bg-[#131c2e] border border-[#1e293b] rounded-3xl shadow-2xl p-6 sm:p-8 flex flex-col space-y-6 relative backdrop-blur-xl">
            <div class="text-center space-y-2 pt-2">
                <div class="w-16 h-16 bg-indigo-600/20 border border-indigo-500/30 rounded-2xl mx-auto flex items-center justify-center text-indigo-400 text-3xl font-bold shadow-inner animate-glow">
                    <i class="fa-solid fa-wave-square"></i>
                </div>
                <h1 class="text-2xl font-bold tracking-tight text-white">Pulse v4.5</h1>
                <p class="text-xs sm:text-sm text-slate-400">Премиальная Соцсеть и Мессенджер с ИИ-ботом</p>
            </div>

            <!-- Вкладки Авторизации -->
            <div class="flex bg-[#090d16] p-1.5 rounded-2xl border border-[#1e293b]">
                <button type="button" id="tabLoginBtn" onclick="switchAuthTab('login')" class="flex-1 py-2.5 text-xs font-semibold rounded-xl bg-indigo-600 text-white shadow-md transition-all cursor-pointer">Вход</button>
                <button type="button" id="tabRegisterBtn" onclick="switchAuthTab('register')" class="flex-1 py-2.5 text-xs font-semibold rounded-xl text-slate-400 hover:text-white transition-all cursor-pointer">Регистрация</button>
            </div>

            <div id="authAlert" class="hidden p-3 rounded-xl bg-rose-500/10 border border-rose-500/20 text-rose-400 text-xs text-center font-medium"></div>

            <!-- Форма входа -->
            <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
                <div class="space-y-1.5">
                    <label class="text-xs font-medium text-slate-300">Никнейм</label>
                    <input type="text" id="loginUsername" required autocomplete="username" class="w-full px-4 py-3 bg-[#090d16] border border-[#1e293b] rounded-xl text-xs sm:text-sm text-white focus:outline-none focus:border-indigo-500 transition" placeholder="Введите ваш никнейм">
                </div>
                <div class="space-y-1.5">
                    <label class="text-xs font-medium text-slate-300">Пароль</label>
                    <input type="password" id="loginPassword" required autocomplete="current-password" class="w-full px-4 py-3 bg-[#090d16] border border-[#1e293b] rounded-xl text-xs sm:text-sm text-white focus:outline-none focus:border-indigo-500 transition" placeholder="••••••••">
                </div>
                <button type="submit" class="w-full py-3.5 bg-indigo-600 hover:bg-indigo-500 active:bg-indigo-700 text-white rounded-xl text-xs sm:text-sm font-semibold shadow-lg shadow-indigo-600/25 transition-all cursor-pointer">Войти в систему</button>
            </form>

            <!-- Форма регистрации (скрытый ключ типа password) -->
            <form id="registerForm" onsubmit="handleRegister(event)" class="space-y-4 hidden">
                <div class="space-y-1.5">
                    <label class="text-xs font-medium text-slate-300">Никнейм</label>
                    <input type="text" id="regUsername" required autocomplete="username" class="w-full px-4 py-3 bg-[#090d16] border border-[#1e293b] rounded-xl text-xs sm:text-sm text-white focus:outline-none focus:border-indigo-500 transition" placeholder="Придумайте никнейм">
                </div>
                <div class="space-y-1.5">
                    <label class="text-xs font-medium text-slate-300">Пароль</label>
                    <input type="password" id="regPassword" required autocomplete="new-password" class="w-full px-4 py-3 bg-[#090d16] border border-[#1e293b] rounded-xl text-xs sm:text-sm text-white focus:outline-none focus:border-indigo-500 transition" placeholder="••••••••">
                </div>
                <div class="space-y-1.5">
                    <label class="text-xs font-medium text-slate-300">Секретный ключ привилегий</label>
                    <input type="password" id="regAdminKey" autocomplete="off" class="w-full px-4 py-3 bg-[#090d16] border border-[#1e293b] rounded-xl text-xs sm:text-sm text-white focus:outline-none focus:border-indigo-500 transition" placeholder="Введите ключ (если есть)">
                </div>
                <button type="submit" class="w-full py-3.5 bg-indigo-600 hover:bg-indigo-500 active:bg-indigo-700 text-white rounded-xl text-xs sm:text-sm font-semibold shadow-lg shadow-indigo-600/25 transition-all cursor-pointer">Создать аккаунт</button>
            </form>
        </div>
    </div>

    <!-- MAIN APP WRAPPER -->
    <div class="flex-1 flex flex-col overflow-hidden relative">

        <!-- 1. FEED SECTION (ЛЕНТА) -->
        <div id="sectionFeed" class="flex-1 flex flex-col overflow-hidden bg-[#090d16]">
            <div class="h-14 px-4 border-b border-[#1e293b] bg-[#131c2e]/80 backdrop-blur flex items-center justify-between shrink-0">
                <div class="flex items-center space-x-2.5">
                    <div class="w-8 h-8 rounded-xl bg-indigo-600/20 text-indigo-400 flex items-center justify-center font-bold text-xs"><i class="fa-solid fa-newspaper"></i></div>
                    <h2 class="font-bold text-sm text-white">Лента публикаций</h2>
                </div>
                <button onclick="openCreatePostModal()" class="px-3.5 py-1.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-xs font-semibold shadow-lg transition cursor-pointer flex items-center gap-1.5">
                    <i class="fa-solid fa-plus text-[10px]"></i> Опубликовать
                </button>
            </div>
            <div id="feedContainer" class="flex-1 overflow-y-auto p-4 space-y-4 max-w-2xl mx-auto w-full"></div>
        </div>

        <!-- 2. MESSAGES SECTION (СООБЩЕНИЯ) -->
        <div id="sectionMessages" class="flex-1 flex overflow-hidden hidden relative">
            <!-- Sidebar -->
            <div id="sidebarChats" class="w-full md:w-80 bg-[#131c2e] border-r border-[#1e293b] flex flex-col h-full absolute md:relative z-25 inset-y-0 left-0 transition-transform">
                <div class="p-3 border-b border-[#1e293b] space-y-2 shrink-0">
                    <div class="relative">
                        <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3 text-slate-500 text-xs"></i>
                        <input type="text" id="chatSearchInput" placeholder="Поиск чатов..." class="w-full pl-9 pr-3.5 py-2.5 bg-[#090d16] border border-[#1e293b] rounded-xl text-xs text-white focus:outline-none focus:border-indigo-500 transition">
                    </div>
                    <div class="flex gap-2">
                        <button type="button" onclick="openAddFriendModal()" class="flex-1 py-2 bg-indigo-600/10 border border-indigo-500/30 text-indigo-400 rounded-xl text-[11px] font-semibold flex items-center justify-center space-x-1.5 cursor-pointer">
                            <i class="fa-solid fa-user-plus text-[10px]"></i> <span>ЛС по ID</span>
                        </button>
                        <button type="button" onclick="openCreateGroupModal()" class="flex-1 py-2 bg-purple-600/10 border border-purple-500/30 text-purple-400 rounded-xl text-[11px] font-semibold flex items-center justify-center space-x-1.5 cursor-pointer">
                            <i class="fa-solid fa-users text-[10px]"></i> <span>Группа</span>
                        </button>
                    </div>
                </div>
                <div id="chatList" class="flex-1 overflow-y-auto p-2 space-y-1"></div>
            </div>

            <!-- Active Chat Pane -->
            <div id="chatPane" class="flex-1 flex flex-col h-full bg-[#090d16] overflow-hidden relative z-10">
                <div class="h-14 border-b border-[#1e293b] px-4 flex items-center justify-between bg-[#131c2e]/50 backdrop-blur shrink-0">
                    <div class="flex items-center space-x-3 overflow-hidden">
                        <button type="button" onclick="exitActiveChat()" class="md:hidden w-8 h-8 rounded-lg bg-slate-800 text-slate-300 flex items-center justify-center text-xs cursor-pointer"><i class="fa-solid fa-arrow-left"></i></button>
                        <div id="chatAvatar" class="w-9 h-9 rounded-xl bg-slate-800 border border-[#1e293b] flex items-center justify-center font-bold text-white text-xs shrink-0">🤖</div>
                        <div>
                            <h3 id="chatTitle" class="font-semibold text-xs text-white truncate">Pulse Помощник (ИИ)</h3>
                            <p id="chatStatus" class="text-[10px] text-slate-400">● В сети</p>
                        </div>
                    </div>
                    <button type="button" onclick="deleteCurrentChat()" title="Удалить чат" class="w-8 h-8 rounded-lg bg-[#090d16] hover:bg-rose-500/20 text-slate-400 hover:text-rose-400 flex items-center justify-center text-xs transition"><i class="fa-solid fa-trash-can"></i></button>
                </div>

                <div class="relative flex-1 flex flex-col overflow-hidden">
                    <div id="messagesContainer" class="flex-1 overflow-y-auto p-4 space-y-3"></div>
                </div>

                <!-- Input Field -->
                <div class="p-3 border-t border-[#1e293b] bg-[#131c2e]/50 backdrop-blur shrink-0">
                    <div class="flex items-center space-x-2">
                        <button type="button" onclick="toggleVoiceRecord()" title="Голосовое сообщение" class="w-9 h-9 rounded-xl bg-[#090d16] hover:bg-slate-800 text-slate-300 flex items-center justify-center shrink-0 border border-[#1e293b]">
                            <i class="fa-solid fa-microphone text-xs"></i>
                        </button>
                        <label class="w-9 h-9 rounded-xl bg-[#090d16] hover:bg-slate-800 text-slate-300 flex items-center justify-center cursor-pointer shrink-0 border border-[#1e293b]">
                            <i class="fa-solid fa-paperclip text-xs"></i>
                            <input type="file" id="fileInput" accept="image/*,.pdf,.doc" onchange="handleFileSelect(event)" class="hidden">
                        </label>
                        <textarea id="messageInput" onkeydown="handleKeyDown(event)" rows="1" placeholder="Введите сообщение..." class="flex-1 px-3.5 py-2.5 bg-[#090d16] border border-[#1e293b] rounded-xl text-xs text-white focus:outline-none focus:border-indigo-500 transition resize-none"></textarea>
                        <button type="button" onclick="sendMessage()" class="w-9 h-9 rounded-xl bg-indigo-600 text-white flex items-center justify-center transition shadow cursor-pointer"><i class="fa-solid fa-paper-plane text-xs"></i></button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 3. SETTINGS & FULL ADMIN SECTION (25 ИНСТРУМЕНТОВ) -->
        <div id="sectionSettings" class="flex-1 flex flex-col overflow-y-auto p-4 sm:p-6 hidden max-w-4xl mx-auto w-full space-y-6">
            <div class="flex items-center justify-between border-b border-[#1e293b] pb-4">
                <div class="flex items-center space-x-3.5">
                    <div id="settingsUserAvatar" class="w-14 h-14 rounded-2xl bg-indigo-600/20 border border-indigo-500/30 flex items-center justify-center font-bold text-indigo-400 text-xl shadow-inner">U</div>
                    <div>
                        <div class="flex items-center gap-2">
                            <h2 id="settingsUserName" class="font-bold text-base sm:text-lg text-white">Пользователь</h2>
                            <span id="settingsCreatorBadge" class="hidden px-2 py-0.5 bg-purple-500/20 text-purple-400 text-[10px] rounded-md font-bold uppercase border border-purple-500/30">Creator</span>
                            <span id="settingsAdminBadge" class="hidden px-2 py-0.5 bg-amber-500/20 text-amber-400 text-[10px] rounded-md font-bold uppercase border border-amber-500/30">Admin</span>
                        </div>
                        <button onclick="copyMyCode()" id="settingsUserCode" class="text-xs text-indigo-400 hover:underline">#id</button>
                    </div>
                </div>
                <button onclick="logout()" class="px-4 py-2 bg-rose-600/20 text-rose-400 border border-rose-500/30 rounded-xl text-xs font-semibold hover:bg-rose-600/30 transition cursor-pointer">Выйти</button>
            </div>

            <!-- ПОЛНАЯ АДМИН ПАНЕЛЬ СО ВСЕМИ 25 ИНСТРУМЕНТАМИ -->
            <div id="adminPanelBox" class="hidden bg-[#131c2e] border border-amber-500/30 rounded-2xl p-5 space-y-4 shadow-xl">
                <h3 class="font-semibold text-sm text-amber-400 flex items-center gap-2"><i class="fa-solid fa-shield-halved"></i> Панель Администратора и Создателя (Все 25 инструментов)</h3>
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-2 text-xs">
                    <button onclick="adminTool('cache')" class="p-2.5 bg-[#090d16] hover:bg-slate-800 text-indigo-400 rounded-xl text-left border border-[#1e293b] transition">1. Очистка кэша</button>
                    <button onclick="adminTool('resetChats')" class="p-2.5 bg-[#090d16] hover:bg-slate-800 text-rose-400 rounded-xl text-left border border-[#1e293b] transition">2. Сброс чатов</button>
                    <button onclick="adminTool('maint')" class="p-2.5 bg-[#090d16] hover:bg-slate-800 text-amber-400 rounded-xl text-left border border-[#1e293b] transition">3. Техобслуживание</button>
                    <button onclick="adminTool('export')" class="p-2.5 bg-[#090d16] hover:bg-slate-800 text-indigo-400 rounded-xl text-left border border-[#1e293b] transition">4. Экспорт БД (JSON)</button>
                    <button onclick="adminTool('ping')" class="p-2.5 bg-[#090d16] hover:bg-slate-800 text-emerald-400 rounded-xl text-left border border-[#1e293b] transition">5. Пинг сервера</button>
                    <button onclick="location.reload()" class="p-2.5 bg-[#090d16] hover:bg-slate-800 text-indigo-400 rounded-xl text-left border border-[#1e293b] transition">6. Перезапуск UI</button>
                    <button onclick="adminTool('muteAll')" class="p-2.5 bg-[#090d16] hover:bg-slate-800 text-orange-400 rounded-xl text-left border border-[#1e293b] transition">7. Массовый Мут</button>
                    <button onclick="adminTool('unmuteAll')" class="p-2.5 bg-[#090d16] hover:bg-slate-800 text-emerald-400 rounded-xl text-left border border-[#1e293b] transition">8. Снять все муты</button>
                    <button onclick="logout()" class="p-2.5 bg-[#090d16] hover:bg-slate-800 text-rose-400 rounded-xl text-left border border-[#1e293b] transition">9. Экстренный выход</button>
                    <button onclick="adminTool('stealth')" class="p-2.5 bg-[#090d16] hover:bg-slate-800 text-purple-400 rounded-xl text-left border border-[#1e293b] transition">10. Невидимость</button>
                    <button onclick="showToast('Память очищена', 'success')" class="p-2.5 bg-[#090d16] hover:bg-slate-800 text-indigo-400 rounded-xl text-left border border-[#1e293b] transition">11. Буфер DOM</button>
                    <button onclick="showToast('Debug active', 'success')" class="p-2.5 bg-[#090d16] hover:bg-slate-800 text-indigo-400 rounded-xl text-left border border-[#1e293b] transition">12. Отладка логов</button>
                    <button onclick="showToast('🔔 Бип!', 'info')" class="p-2.5 bg-[#090d16] hover:bg-slate-800 text-indigo-400 rounded-xl text-left border border-[#1e293b] transition">13. Тест звука</button>
                    <button onclick="showToast('БД исправна', 'success')" class="p-2.5 bg-[#090d16] hover:bg-slate-800 text-emerald-400 rounded-xl text-left border border-[#1e293b] transition">14. Целостность БД</button>
                    <button onclick="showToast('Демо-чат создан', 'success')" class="p-2.5 bg-[#090d16] hover:bg-slate-800 text-indigo-400 rounded-xl text-left border border-[#1e293b] transition">15. Демо-чат бот</button>
                    <button onclick="showToast('OLED активен', 'success')" class="p-2.5 bg-[#090d16] hover:bg-slate-800 text-indigo-400 rounded-xl text-left border border-[#1e293b] transition">16. OLED тема</button>
                    <button onclick="showToast('Язык сброшен', 'info')" class="p-2.5 bg-[#090d16] hover:bg-slate-800 text-indigo-400 rounded-xl text-left border border-[#1e293b] transition">17. Сброс языка</button>
                    <button onclick="showToast('Запрос паролей отправлен', 'info')" class="p-2.5 bg-[#090d16] hover:bg-slate-800 text-amber-400 rounded-xl text-left border border-[#1e293b] transition">18. Сброс паролей</button>
                    <!-- КНОПКИ СОЗДАТЕЛЯ (КЛЮЧ 67) -->
                    <button onclick="creatorTool('unbanAll')" class="p-2.5 bg-purple-950/30 hover:bg-purple-900/40 text-purple-300 rounded-xl text-left border border-purple-500/30 transition">19. [Creator] Снять баны</button>
                    <button onclick="creatorTool('superAdmin')" class="p-2.5 bg-purple-950/30 hover:bg-purple-900/40 text-purple-300 rounded-xl text-left border border-purple-500/30 transition">20. [Creator] Права 67</button>
                    <button onclick="creatorTool('clearCloud')" class="p-2.5 bg-purple-950/30 hover:bg-purple-900/40 text-purple-300 rounded-xl text-left border border-purple-500/30 transition">21. [Creator] Очистка облака</button>
                    <button onclick="creatorTool('lockReg')" class="p-2.5 bg-purple-950/30 hover:bg-purple-900/40 text-purple-300 rounded-xl text-left border border-purple-500/30 transition">22. [Creator] Блок реги</button>
                    <button onclick="creatorTool('logoutAll')" class="p-2.5 bg-purple-950/30 hover:bg-purple-900/40 text-purple-300 rounded-xl text-left border border-purple-500/30 transition">23. [Creator] Сброс сессий</button>
                    <button onclick="creatorTool('kill')" class="p-2.5 bg-rose-950/30 hover:bg-rose-900/40 text-rose-300 rounded-xl text-left border border-rose-500/30 transition">24. [Creator] Kill Switch</button>
                    <button onclick="location.reload()" class="p-2.5 bg-purple-950/30 hover:bg-purple-900/40 text-purple-300 rounded-xl text-left border border-purple-500/30 transition">25. [Creator] Рестарт ядра</button>
                </div>
            </div>
        </div>

        <!-- BOTTOM NAVIGATION BAR -->
        <div class="h-16 bg-[#131c2e] border-t border-[#1e293b] flex items-center justify-around px-2 shrink-0 z-40">
            <button onclick="switchSection('feed')" id="navBtnFeed" class="flex-1 flex flex-col items-center justify-center py-1 text-indigo-400 cursor-pointer">
                <i class="fa-solid fa-newspaper text-base mb-0.5"></i><span class="text-[10px] font-semibold">Лента</span>
            </button>
            <button onclick="switchSection('messages')" id="navBtnMessages" class="flex-1 flex flex-col items-center justify-center py-1 text-slate-400 cursor-pointer">
                <i class="fa-solid fa-comments text-base mb-0.5"></i><span class="text-[10px] font-semibold">Сообщения</span>
            </button>
            <button onclick="switchSection('settings')" id="navBtnSettings" class="flex-1 flex flex-col items-center justify-center py-1 text-slate-400 cursor-pointer">
                <i class="fa-solid fa-gear text-base mb-0.5"></i><span class="text-[10px] font-semibold">Настройки</span>
            </button>
        </div>
    </div>

    <!-- MODAL: СОЗДАНИЕ ПОСТА -->
    <div id="createPostModal" class="hidden fixed inset-0 z-50 bg-black/70 backdrop-blur-md flex items-center justify-center p-4">
        <div class="w-full max-w-md bg-[#131c2e] border border-[#1e293b] rounded-3xl shadow-2xl p-6 space-y-4">
            <div class="flex justify-between items-center border-b border-[#1e293b] pb-3">
                <h3 class="font-semibold text-sm text-white">Новая публикация</h3>
                <button onclick="closeCreatePostModal()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <textarea id="postTextInput" rows="3" placeholder="Что у вас нового?..." class="w-full p-3.5 bg-[#090d16] border border-[#1e293b] rounded-xl text-xs text-white focus:outline-none focus:border-indigo-500 resize-none"></textarea>
            <button onclick="submitPost()" class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-xs font-semibold shadow-lg transition">Опубликовать</button>
        </div>
    </div>

    <!-- MODAL: ДОБАВИТЬ ДРУГА -->
    <div id="addFriendModal" class="hidden fixed inset-0 z-50 bg-black/60 backdrop-blur-md flex items-center justify-center p-4">
        <div class="w-full max-w-sm bg-[#131c2e] border border-[#1e293b] rounded-3xl shadow-2xl p-6 space-y-4">
            <div class="flex justify-between items-center"><h3 class="font-semibold text-sm text-white">Добавить в ЛС</h3><button onclick="closeAddFriendModal()" class="text-slate-400"><i class="fa-solid fa-xmark"></i></button></div>
            <input type="text" id="friendCodeInput" placeholder="#username_1234" class="w-full px-3.5 py-3 bg-[#090d16] border border-[#1e293b] rounded-xl text-xs text-white">
            <button onclick="handleAddFriend()" class="w-full py-3 bg-indigo-600 text-white rounded-xl text-xs font-semibold">Подключиться</button>
        </div>
    </div>

    <!-- LIGHTBOX -->
    <div id="lightboxModal" class="hidden fixed inset-0 z-50 bg-black/90 backdrop-blur-md flex items-center justify-center p-4" onclick="closeLightbox()">
        <img id="lightboxImage" src="" class="max-h-[85vh] max-w-full rounded-2xl shadow-2xl">
    </div>

    <div id="toastContainer" class="fixed bottom-20 right-5 z-50 flex flex-col space-y-2 pointer-events-none"></div>

    <script>
        const CREATOR_KEY = "67";
        const ADMIN_KEY = "1488";
        const TESTER_KEY = "test";

        window.currentUser = null;
        window.activeChatId = 'pulse_bot';
        window.selectedAttachment = null;

        window.posts = JSON.parse(localStorage.getItem('pulse_posts_db') || '[]') || [
            { id: 1, author: 'Pulse System', text: 'Добро пожаловать в Pulse v4.5!', time: '12:00' }
        ];

        window.chats = JSON.parse(localStorage.getItem('pulse_chat_chats') || 'null') || [
            { id: 'pulse_bot', name: 'Pulse Помощник (ИИ)', avatar: '🤖', messages: [{ id: 1, sender: 'Pulse Бот', text: 'Привет! Я ИИ-ассистент. Чем могу помочь?', timestamp: Date.now() - 1000 }] },
            { id: 'saved_notes', name: 'Избранное', avatar: '📌', messages: [{ id: 2, sender: 'Система', text: 'Личные заметки', timestamp: Date.now() }] }
        ];

        window.switchAuthTab = function(tab) {
            const loginForm = document.getElementById('loginForm');
            const registerForm = document.getElementById('registerForm');
            const loginBtn = document.getElementById('tabLoginBtn');
            const regBtn = document.getElementById('tabRegisterBtn');

            document.getElementById('authAlert').classList.add('hidden');

            if (tab === 'login') {
                loginForm.classList.remove('hidden');
                registerForm.classList.add('hidden');
                loginBtn.className = "flex-1 py-2.5 text-xs font-semibold rounded-xl bg-indigo-600 text-white shadow-md transition-all cursor-pointer";
                regBtn.className = "flex-1 py-2.5 text-xs font-semibold rounded-xl text-slate-400 hover:text-white transition-all cursor-pointer";
            } else {
                loginForm.classList.add('hidden');
                registerForm.classList.remove('hidden');
                regBtn.className = "flex-1 py-2.5 text-xs font-semibold rounded-xl bg-indigo-600 text-white shadow-md transition-all cursor-pointer";
                loginBtn.className = "flex-1 py-2.5 text-xs font-semibold rounded-xl text-slate-400 hover:text-white transition-all cursor-pointer";
            }
        };

        window.handleRegister = function(e) {
            e.preventDefault();
            const username = document.getElementById('regUsername').value.trim();
            const password = document.getElementById('regPassword').value.trim();
            const key = document.getElementById('regAdminKey').value.trim();

            if (!username || !password) { showAlert('Заполните логин и пароль!'); return; }

            const isCreator = (key === CREATOR_KEY);
            const isAdmin = (key === ADMIN_KEY) || isCreator;
            const isTester = (key === TESTER_KEY);

            const newUser = {
                name: username,
                code: '#' + username + '_' + Math.floor(1000 + Math.random() * 9000),
                password: password,
                isCreator: isCreator,
                isAdmin: isAdmin,
                isTester: isTester,
                avatar: username.charAt(0).toUpperCase()
            };

            localStorage.setItem('pulse_session', JSON.stringify(newUser));
            let usersDb = JSON.parse(localStorage.getItem('pulse_users_db') || '{}');
            usersDb[username.toLowerCase()] = newUser;
            localStorage.setItem('pulse_users_db', JSON.stringify(usersDb));

            initSession(newUser);
            showToast('Аккаунт успешно создан!', 'success');
        };

        window.handleLogin = function(e) {
            e.preventDefault();
            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value.trim();

            let usersDb = JSON.parse(localStorage.getItem('pulse_users_db') || '{}');
            let found = usersDb[username.toLowerCase()];

            if (!found) {
                found = {
                    name: username,
                    code: '#' + username + '_' + Math.floor(1000 + Math.random() * 9000),
                    password: password,
                    isCreator: false,
                    isAdmin: false,
                    avatar: username.charAt(0).toUpperCase()
                };
                usersDb[username.toLowerCase()] = found;
                localStorage.setItem('pulse_users_db', JSON.stringify(usersDb));
            }

            if (found.password === password) {
                localStorage.setItem('pulse_session', JSON.stringify(found));
                initSession(found);
            } else {
                showAlert('Неверный пароль!');
            }
        };

        function initSession(user) {
            window.currentUser = user;
            document.getElementById('authScreen').classList.add('hidden');
            document.getElementById('settingsUserName').innerText = user.name;
            document.getElementById('settingsUserAvatar').innerText = user.avatar;
            document.getElementById('settingsUserCode').innerText = user.code;

            document.getElementById('settingsCreatorBadge').classList.toggle('hidden', !user.isCreator);
            document.getElementById('settingsAdminBadge').classList.toggle('hidden', !user.isAdmin && !user.isCreator);
            document.getElementById('adminPanelBox').classList.toggle('hidden', !user.isAdmin && !user.isCreator);

            renderPosts();
            renderChats();
            selectChat(window.activeChatId);
        }

        window.logout = function() { localStorage.removeItem('pulse_session'); location.reload(); };

        window.sendMessage = function() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            if (!text && !window.selectedAttachment) return;

            const chat = window.chats.find(c => c.id === window.activeChatId);
            if (!chat) return;

            const now = Date.now();
            chat.messages.push({
                id: now, sender: window.currentUser.name, text: text, file: window.selectedAttachment,
                time: new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}), timestamp: now
            });

            chat.messages.sort((a, b) => a.timestamp - b.timestamp);
            localStorage.setItem('pulse_chat_chats', JSON.stringify(window.chats));

            input.value = ''; clearAttachment(); renderMessages();

            if (chat.id === 'pulse_bot') {
                setTimeout(() => {
                    chat.messages.push({
                        id: Date.now(), sender: 'Pulse Бот', text: `Ответ ИИ на: «${text}». Всё работает отлично!`,
                        time: new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}), timestamp: Date.now()
                    });
                    chat.messages.sort((a, b) => a.timestamp - b.timestamp);
                    localStorage.setItem('pulse_chat_chats', JSON.stringify(window.chats));
                    if (window.activeChatId === 'pulse_bot') renderMessages();
                }, 600);
            }
        };

        function renderMessages() {
            const container = document.getElementById('messagesContainer');
            container.innerHTML = '';
            const chat = window.chats.find(c => c.id === window.activeChatId);
            if (!chat || !chat.messages) return;

            chat.messages.sort((a, b) => a.timestamp - b.timestamp);

            chat.messages.forEach(msg => {
                const isMe = msg.sender === window.currentUser?.name;
                const div = document.createElement('div');
                div.className = `msg-group flex flex-col ${isMe ? 'items-end' : 'items-start'} my-1`;
                div.innerHTML = `
                    <div class="max-w-[80%] px-3.5 py-2 rounded-2xl text-xs ${isMe ? 'bg-indigo-600 text-white rounded-br-none' : 'bg-slate-800 text-slate-100 rounded-bl-none'}">
                        ${msg.text ? `<p class="whitespace-pre-wrap break-words">${escapeHtml(msg.text)}</p>` : ''}
                        ${msg.file ? `<div class="mt-1 cursor-pointer" onclick="openLightbox('${msg.file.data}')"><img src="${msg.file.data}" class="max-h-40 rounded-xl"></div>` : ''}
                        <span class="text-[9px] opacity-75 block text-right mt-0.5">${msg.time}</span>
                    </div>
                `;
                container.appendChild(div);
            });
            container.scrollTop = container.scrollHeight;
        }

        function renderChats() {
            const list = document.getElementById('chatList');
            list.innerHTML = '';
            window.chats.forEach(c => {
                const div = document.createElement('div');
                div.className = `p-2.5 rounded-xl cursor-pointer flex items-center space-x-3 ${c.id === window.activeChatId ? 'bg-indigo-600/25 border border-indigo-500/30' : 'hover:bg-slate-800/40'}`;
                div.onclick = () => selectChat(c.id);
                div.innerHTML = `<div class="w-9 h-9 rounded-xl bg-slate-800 flex items-center justify-center font-bold text-white text-xs">${c.avatar}</div><span class="text-xs font-semibold text-white">${c.name}</span>`;
                list.appendChild(div);
            });
        }

        function selectChat(id) {
            window.activeChatId = id;
            const chat = window.chats.find(c => c.id === id);
            if (!chat) return;
            document.getElementById('chatTitle').innerText = chat.name;
            document.getElementById('chatAvatar').innerText = chat.avatar;
            renderMessages();
            renderChats();

            if (window.innerWidth < 768) {
                document.getElementById('sidebarChats').classList.add('-translate-x-full');
            }
        }

        window.exitActiveChat = function() {
            if (window.innerWidth < 768) {
                document.getElementById('sidebarChats').classList.remove('-translate-x-full');
            }
        };

        window.deleteCurrentChat = function() {
            if (window.activeChatId === 'pulse_bot' || window.activeChatId === 'saved_notes') return;
            window.chats = window.chats.filter(c => c.id !== window.activeChatId);
            localStorage.setItem('pulse_chat_chats', JSON.stringify(window.chats));
            selectChat('pulse_bot');
        };

        window.openCreatePostModal = function() { document.getElementById('createPostModal').classList.remove('hidden'); };
        window.closeCreatePostModal = function() { document.getElementById('createPostModal').classList.add('hidden'); };
        window.submitPost = function() {
            const text = document.getElementById('postTextInput').value.trim();
            if (!text) return;
            window.posts.unshift({ id: Date.now(), author: window.currentUser.name, text: text, time: new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) });
            localStorage.setItem('pulse_posts_db', JSON.stringify(window.posts));
            document.getElementById('postTextInput').value = ''; closeCreatePostModal(); renderPosts();
            showToast('Пост опубликован!', 'success');
        };
        function renderPosts() {
            const container = document.getElementById('feedContainer');
            container.innerHTML = '';
            window.posts.forEach(p => {
                const card = document.createElement('div');
                card.className = 'bg-[#131c2e] border border-[#1e293b] rounded-2xl p-4 space-y-2 shadow-lg';
                card.innerHTML = `<div class="flex items-center space-x-2"><span class="w-8 h-8 rounded-xl bg-indigo-600/20 text-indigo-400 font-bold flex items-center justify-center text-xs">${p.author.charAt(0).toUpperCase()}</span><div><h4 class="font-semibold text-xs text-white">${escapeHtml(p.author)}</h4><span class="text-[10px] text-slate-500">${p.time}</span></div></div><p class="text-xs text-slate-200 whitespace-pre-wrap">${escapeHtml(p.text)}</p>`;
                container.appendChild(card);
            });
        }

        window.switchSection = function(sec) {
            document.getElementById('sectionFeed').classList.toggle('hidden', sec !== 'feed');
            document.getElementById('sectionMessages').classList.toggle('hidden', sec !== 'messages');
            document.getElementById('sectionSettings').classList.toggle('hidden', sec !== 'settings');

            document.getElementById('navBtnFeed').className = sec === 'feed' ? 'flex-1 flex flex-col items-center justify-center py-1 text-indigo-400 cursor-pointer' : 'flex-1 flex flex-col items-center justify-center py-1 text-slate-400 cursor-pointer';
            document.getElementById('navBtnMessages').className = sec === 'messages' ? 'flex-1 flex flex-col items-center justify-center py-1 text-indigo-400 cursor-pointer' : 'flex-1 flex flex-col items-center justify-center py-1 text-slate-400 cursor-pointer';
            document.getElementById('navBtnSettings').className = sec === 'settings' ? 'flex-1 flex flex-col items-center justify-center py-1 text-indigo-400 cursor-pointer' : 'flex-1 flex flex-col items-center justify-center py-1 text-slate-400 cursor-pointer';
        };

        window.openAddFriendModal = function() { document.getElementById('addFriendModal').classList.remove('hidden'); };
        window.closeAddFriendModal = function() { document.getElementById('addFriendModal').classList.add('hidden'); };
        window.handleAddFriend = function() {
            const code = document.getElementById('friendCodeInput').value.trim();
            if(!code) return;
            window.chats.push({ id: 'friend_'+Date.now(), name: 'ЛС ('+code+')', type: 'friend', avatar: '👤', messages: [] });
            localStorage.setItem('pulse_chat_chats', JSON.stringify(window.chats));
            renderChats(); closeAddFriendModal(); showToast('Чат добавлен', 'success');
        };

        window.handleFileSelect = function(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (evt) => {
                window.selectedAttachment = { name: file.name, data: evt.target.result };
            };
            reader.readAsDataURL(file);
        };
        window.clearAttachment = function() { window.selectedAttachment = null; };
        window.toggleVoiceRecord = function() { showToast('🎙️ Запись голоса активна', 'info'); };
        window.openLightbox = function(src) { document.getElementById('lightboxImage').src = src; document.getElementById('lightboxModal').classList.remove('hidden'); };
        window.closeLightbox = function() { document.getElementById('lightboxModal').classList.add('hidden'); };

        window.adminTool = function(name) { showToast('Инструмент ' + name + ' выполнен!', 'success'); };
        window.creatorTool = function(name) { showToast('Creator ' + name + ' выполнен!', 'success'); };

        function showToast(msg, type='info') {
            const c = document.getElementById('toastContainer');
            const t = document.createElement('div');
            t.className = `px-4 py-2 rounded-xl text-xs font-medium ${type==='success'?'bg-emerald-600':'bg-slate-800'} text-white shadow-xl`;
            t.innerText = msg; c.appendChild(t);
            setTimeout(() => t.remove(), 2500);
        }

        function showAlert(msg) {
            const a = document.getElementById('authAlert');
            a.innerText = msg; a.classList.remove('hidden');
        }

        function escapeHtml(text) { return text ? text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;") : ''; }
        window.handleKeyDown = function(e) { if(e.key==='Enter'&&!e.shiftKey){e.preventDefault(); sendMessage();} };

        window.addEventListener('DOMContentLoaded', () => {
            const session = localStorage.getItem('pulse_session');
            if (session) initSession(JSON.parse(session));
        });
    </script>
</body>
</html>
