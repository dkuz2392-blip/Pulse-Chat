    <script>
        // ХЕЛПЕР ЗАЩИТЫ ОТ XSS
        function escapeHTML(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        // ХЕШИРОВАНИЕ ПАРОЛЕЙ (SHA-256)
        async function hashPassword(password) {
            const encoder = new TextEncoder();
            const data = encoder.encode(password + "_pulse_salt_2026");
            const hashBuffer = await crypto.subtle.digest('SHA-256', data);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        const firebaseConfig = {
            apiKey: "AIzaSyB1LB4QtDcDJtjElu7Uqy0f3cql66NMgAE",
            authDomain: "pulse-chat-c7c98.firebaseapp.com",
            projectId: "pulse-chat-c7c98",
            storageBucket: "pulse-chat-c7c98.firebasestorage.app",
            messagingSenderId: "308291242163",
            appId: "1:308291242163:web:df36477f216df9971208c6"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        window.CREATOR_KEY = "67";      
        window.MASTER_ADMIN_KEY = "1488"; 
        window.currentUser = null;
        window.activeChatId = 'pulse_global';
        window.activeChatListener = null;

        window.chats = [
            { id: 'pulse_global', name: 'Общий чат', type: 'group' }
        ];

        window.setTheme = function(theme) {
            document.body.className = document.body.className.replace(/theme-\w+/g, '');
            document.body.classList.add('theme-' + theme);
            localStorage.setItem('pulse_theme', theme);
        };
        const savedTheme = localStorage.getItem('pulse_theme');
        if (savedTheme) window.setTheme(savedTheme);

        window.addEventListener('DOMContentLoaded', () => {
            const session = localStorage.getItem('pulse_session');
            if (session) {
                try { initSession(JSON.parse(session)); } catch(e) { localStorage.removeItem('pulse_session'); }
            }
        });

        window.switchAuthTab = function(tab) {
            document.getElementById('loginForm').classList.toggle('hidden', tab !== 'login');
            document.getElementById('registerForm').classList.toggle('hidden', tab !== 'register');
            document.getElementById('tabLoginBtn').className = `flex-1 py-2 text-xs font-semibold rounded-lg ${tab==='login'?'bg-primaryAccent text-white shadow':'text-slate-400'}`;
            document.getElementById('tabRegisterBtn').className = `flex-1 py-2 text-xs font-semibold rounded-lg ${tab==='register'?'bg-primaryAccent text-white shadow':'text-slate-400'}`;
        };

        window.handleLogin = async function() {
            const username = document.getElementById('loginUsername').value.trim().toLowerCase();
            const password = document.getElementById('loginPassword').value;
            if (!username || !password) { showAlert('Заполните поля'); return; }
            
            try {
                const hashedPassword = await hashPassword(password);
                let docSnap = await db.collection('users').doc(username).get();
                if (!docSnap.exists) {
                    docSnap = await db.collection('pulse-chat-app').doc('pulse-chat-app').collection('публичный').doc(username).get();
                }
                
                if (docSnap.exists) {
                    const data = docSnap.data();
                    if (data.isBanned) { showAlert('Ваш аккаунт забанен'); return; }
                    
                    if (data.password === hashedPassword || data.password === password) {
                        initSession(data);
                    } else { showAlert('Неверный логин или пароль'); }
                } else { showAlert('Пользователь не найден'); }
            } catch(e) { showAlert('Ошибка сети'); }
        };

        window.handleRegister = async function() {
            const username = document.getElementById('regUsername').value.trim().toLowerCase();
            const password = document.getElementById('regPassword').value;
            const key = document.getElementById('regAdminKey').value.trim();
            if (!username || !password) { showAlert('Заполните обязательные поля'); return; }
            
            try {
                const isCreator = key === window.CREATOR_KEY;
                const isAdmin = key === window.MASTER_ADMIN_KEY || isCreator;
                const code = '#' + username + '_' + Math.floor(1000 + Math.random() * 9000);
                const hashedPassword = await hashPassword(password);
                
                const newUser = { 
                    name: username, 
                    code, 
                    password: hashedPassword, 
                    isCreator, 
                    isAdmin,
                    isBanned: false,
                    isMuted: false,
                    isVerified: false
                };
                
                await db.collection('users').doc(username).set(newUser);
                initSession(newUser);
            } catch(e) { showAlert('Ошибка регистрации'); }
        };

        function initSession(user) {
            window.currentUser = Object.freeze(user);
            localStorage.setItem('pulse_session', JSON.stringify(user));
            
            document.getElementById('authScreen').classList.add('hidden');
            document.getElementById('mainAppContainer').classList.remove('hidden');
            document.getElementById('settingsUserName').innerText = escapeHTML(user.name);
            document.getElementById('settingsUserCode').innerText = escapeHTML(user.code || '#usr');
            document.getElementById('adminPanelBox').classList.toggle('hidden', !user.isAdmin && !user.isCreator);
            
            loadUserChats();
            window.selectChat(window.activeChatId);
            subscribeToFeed();
            subscribeToStories();
        }

        window.confirmLogout = function() {
            if (confirm('Вы уверены, что хотите выйти из профиля?')) {
                localStorage.removeItem('pulse_session');
                location.reload();
            }
        };

        window.switchSection = function(section) {
            ['sectionFeed', 'sectionMessages', 'sectionSettings'].forEach(s => document.getElementById(s).classList.add('hidden'));
            ['navBtnFeed', 'navBtnMessages', 'navBtnSettings'].forEach(b => document.getElementById(b).className = "flex-1 flex flex-col items-center justify-center py-1 text-slate-400 hover:text-slate-200 transition cursor-pointer");

            if (section === 'feed') { document.getElementById('sectionFeed').classList.remove('hidden'); document.getElementById('navBtnFeed').className = "flex-1 flex flex-col items-center justify-center py-1 text-primaryAccent transition cursor-pointer"; }
            else if (section === 'messages') { document.getElementById('sectionMessages').classList.remove('hidden'); document.getElementById('navBtnMessages').className = "flex-1 flex flex-col items-center justify-center py-1 text-primaryAccent transition cursor-pointer"; loadUserChats(); }
            else if (section === 'settings') { document.getElementById('sectionSettings').classList.remove('hidden'); document.getElementById('navBtnSettings').className = "flex-1 flex flex-col items-center justify-center py-1 text-primaryAccent transition cursor-pointer"; if (window.currentUser?.isAdmin || window.currentUser?.isCreator) loadAdminUsers(); }
        };

        window.toggleMobileSidebar = function() { document.getElementById('sidebarChats').classList.toggle('-translate-x-full'); };

        window.openCreatePostModal = () => document.getElementById('createPostModal').classList.remove('hidden');
        window.closeCreatePostModal = () => document.getElementById('createPostModal').classList.add('hidden');
        window.submitPost = async function() {
            const text = document.getElementById('postTextInput').value.trim();
            if (!text) return;
            await db.collection('posts').add({ 
                author: window.currentUser.name, 
                text, 
                time: new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}), 
                timestamp: firebase.firestore.FieldValue.serverTimestamp() 
            });
            document.getElementById('postTextInput').value = ''; 
            closeCreatePostModal();
        };

        function subscribeToFeed() {
            db.collection('posts').orderBy('timestamp', 'desc').limit(50).onSnapshot(snapshot => {
                const container = document.getElementById('feedContainer');
                if (!container) return;
                container.innerHTML = '';
                snapshot.forEach(doc => {
                    const p = doc.data();
                    const firstLetter = escapeHTML(p.author ? p.author.charAt(0).toUpperCase() : 'U');
                    const card = document.createElement('div');
                    card.className = 'bg-darkCard border border-darkBorder rounded-2xl p-4 space-y-2 shadow-lg';
                    card.innerHTML = `<div class="flex items-center space-x-2.5"><div class="w-8 h-8 rounded-xl bg-darkBg border border-darkBorder text-primaryAccent font-bold flex items-center justify-center text-xs">${firstLetter}</div><div><h4 class="font-bold text-xs text-white">${escapeHTML(p.author)}</h4><span class="text-[10px] text-slate-500">${escapeHTML(p.time||'')}</span></div></div><p class="text-xs text-slate-200">${escapeHTML(p.text)}</p>`;
                    container.appendChild(card);
                });
            });
        }

        window.openCreateStoryModal = () => document.getElementById('createStoryModal').classList.remove('hidden');
        window.closeCreateStoryModal = () => document.getElementById('createStoryModal').classList.add('hidden');
        window.submitStory = async function() {
            const text = document.getElementById('storyTextInput').value.trim();
            if (!text) return;
            await db.collection('stories').add({ author: window.currentUser.name, text, timestamp: Date.now() });
            document.getElementById('storyTextInput').value = ''; 
            closeCreateStoryModal();
        };

        function subscribeToStories() {
            db.collection('stories').onSnapshot(snapshot => {
                const tray = document.getElementById('storiesTray');
                if (!tray) return;
                let addBtn = tray.firstElementChild.outerHTML;
                tray.innerHTML = addBtn;
                snapshot.forEach(doc => {
                    const s = doc.data();
                    if (Date.now() - s.timestamp > 86400000) return;
                    const firstLetter = escapeHTML(s.author ? s.author.charAt(0).toUpperCase() : 'U');
                    const div = document.createElement('div');
                    div.className = 'flex flex-col items-center space-y-1 shrink-0';
                    div.innerHTML = `<div class="w-12 h-12 rounded-xl p-0.5 bg-gradient-to-tr from-primaryAccent to-indigo-500 flex items-center justify-center"><div class="w-full h-full bg-darkBg rounded-[10px] flex items-center justify-center font-bold text-[10px] text-white">${firstLetter}</div></div><span class="text-[10px] text-slate-300 truncate max-w-[48px]">${escapeHTML(s.author)}</span>`;
                    tray.appendChild(div);
                });
            });
        }

        // ЗАГРУЗКА И ОТОБРАЖЕНИЕ ЧАТОВ
        async function loadUserChats() {
            window.chats = [{ id: 'pulse_global', name: 'Общий чат', type: 'group' }];
            try {
                const snap = await db.collection('chats').get();
                snap.forEach(doc => {
                    const data = doc.data();
                    if (doc.id !== 'pulse_global' && data.members && data.members.includes(window.currentUser.name)) {
                        window.chats.push({ id: doc.id, name: data.name || doc.id, type: data.type || 'friend' });
                    }
                });
            } catch(e) {}
            window.renderChats();
        }

        window.renderChats = function() {
            const list = document.getElementById('chatList');
            if (!list) return;
            list.innerHTML = '';
            window.chats.forEach(c => {
                const item = document.createElement('div');
                item.className = 'p-3 rounded-xl cursor-pointer transition flex items-center space-x-2 bg-darkBg border border-darkBorder text-white text-xs font-semibold';
                item.innerText = c.name;
                item.onclick = () => { 
                    window.selectChat(c.id); 
                    if(window.innerWidth < 768) {
                        document.getElementById('sidebarChats').classList.add('-translate-x-full');
                    }
                };
                list.appendChild(item);
            });
        };

        // REALTIME ЧАТЫ
        window.selectChat = function(id) {
            window.activeChatId = id;
            const chat = window.chats.find(c => c.id === id);
            if (!chat) return;
            document.getElementById('chatTitle').innerText = chat.name;

            if (window.activeChatListener) window.activeChatListener();

            window.activeChatListener = db.collection('chats').doc(id).collection('messages')
                .onSnapshot(snapshot => {
                    const container = document.getElementById('messagesContainer');
                    if (!container) return;
                    container.innerHTML = '';
                    
                    let messages = [];
                    snapshot.forEach(doc => {
                        messages.push({ id: doc.id, ...doc.data() });
                    });
                    
                    messages.sort((a, b) => (a.timestamp?.toMillis() || a.timeLocal || 0) - (b.timestamp?.toMillis() || b.timeLocal || 0));

                    messages.forEach(m => {
                        const isMe = m.sender === window.currentUser?.name;
                        const div = document.createElement('div');
                        div.className = `flex flex-col ${isMe ? 'items-end' : 'items-start'}`;
                        div.innerHTML = `<div class="max-w-[75%] px-3.5 py-2 rounded-xl text-xs ${isMe ? 'bg-primaryAccent text-white' : 'bg-darkCard text-slate-200 border border-darkBorder'}"><b>${escapeHTML(m.sender)}</b>: ${escapeHTML(m.text)}<div class="text-[8px] opacity-60 text-right mt-0.5">${escapeHTML(m.time||'')}</div></div>`;
                        container.appendChild(div);
                    });
                    container.scrollTop = container.scrollHeight;
                });
        };

        window.sendMessage = async function() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            if (!text) return;
            
            if (window.currentUser.isMuted) {
                alert('Вы замучены администратором.');
                return;
            }

            input.value = '';
            
            const chatRef = db.collection('chats').doc(window.activeChatId);
            const chatDoc = await chatRef.get();
            if (!chatDoc.exists) {
                await chatRef.set({
                    name: window.activeChatId === 'pulse_global' ? 'Общий чат' : window.activeChatId,
                    type: 'friend',
                    members: [window.currentUser.name]
                });
            }

            await chatRef.collection('messages').add({
                sender: window.currentUser.name,
                text: text,
                time: new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}),
                timeLocal: Date.now(),
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            });
        };

        // НАДЕЖНОЕ ОТКРЫТИЕ ЛС ЧЕРЕЗ PROMPT (РАБОТАЕТ ВЕЗДЕ)
        window.openAddFriendModal = async function() {
            let targetName = prompt('Введите никнейм собеседника:');
            if (!targetName) return;
            
            targetName = targetName.trim().toLowerCase().replace(/^#/, '');
            if (targetName.includes('_')) {
                targetName = targetName.split('_')[0];
            }

            if (targetName === window.currentUser.name) {
                alert('Нельзя создать чат с самим собой');
                return;
            }

            const chatId = [window.currentUser.name, targetName].sort().join('_');
            
            await db.collection('chats').doc(chatId).set({
                name: 'ЛС: ' + targetName,
                type: 'friend',
                members: [window.currentUser.name, targetName]
            }, { merge: true });

            loadUserChats();
            window.selectChat(chatId);
        };

        // АДМИН ПАНЕЛЬ
        window.loadAdminUsers = async function() {
            const container = document.getElementById('adminUsersCardsList');
            const countEl = document.getElementById('adminTotalUsersCount');
            if (!container) return;

            container.innerHTML = '<div class="p-3 text-slate-400 text-xs">Загрузка пользователей...</div>';
            const allUsersMap = new Map();

            try {
                const snapshot = await db.collection('users').get();
                snapshot.forEach(doc => {
                    const data = doc.data();
                    allUsersMap.set(doc.id, { id: doc.id, ...data, ref: doc.ref });
                });
            } catch (e) {}

            container.innerHTML = '';
            if (countEl) countEl.innerText = allUsersMap.size;

            allUsersMap.forEach((user) => {
                const firstLetter = escapeHTML(user.name.charAt(0).toUpperCase());
                const roleName = user.isCreator ? 'Creator' : (user.isAdmin ? 'Admin' : 'User');
                const roleBg = user.isCreator ? 'bg-indigo-500/20 text-indigo-300 border-indigo-500/30' : (user.isAdmin ? 'bg-amber-500/20 text-amber-300 border-amber-500/30' : 'bg-slate-700/30 text-slate-300 border-slate-600/30');
                
                const card = document.createElement('div');
                card.className = 'bg-darkBg border border-darkBorder rounded-xl p-3 flex items-center justify-between';
                card.innerHTML = `
                    <div class="flex items-center space-x-3 overflow-hidden">
                        <div class="w-9 h-9 rounded-xl bg-darkCard border border-darkBorder font-bold text-xs text-white flex items-center justify-center shrink-0">${firstLetter}</div>
                        <div class="overflow-hidden">
                            <h4 class="font-bold text-xs text-white truncate">${escapeHTML(user.name)} ${user.isBanned ? '<span class="text-rose-500">[BAN]</span>':''}</h4>
                            <p class="text-[10px] text-slate-400 font-mono truncate">${escapeHTML(user.code||'')}</p>
                        </div>
                    </div>
                    <div class="flex items-center space-x-2 shrink-0">
                        <span class="px-2 py-0.5 rounded-lg border text-[10px] font-semibold ${roleBg}">${roleName}</span>
                        <button onclick="adminDeleteUser('${user.id}')" class="w-7 h-7 rounded-lg bg-rose-500/10 border border-rose-500/20 text-rose-400 flex items-center justify-center text-xs"><i class="fa-solid fa-user-minus"></i></button>
                    </div>
                `;
                container.appendChild(card);
            });
        };

        function logAdminAction(text) {
            const container = document.getElementById('adminLogsContainer');
            if (!container) return;
            const div = document.createElement('div');
            div.innerText = `[${new Date().toLocaleTimeString()}] ${text}`;
            container.prepend(div);
        }

        window.f1_broadcast = async () => { const msg = prompt('Текст рассылки:'); if(msg){ await db.collection('posts').add({ author: 'СИСТЕМА [ADMIN]', text: msg, time: new Date().toLocaleTimeString(), timestamp: firebase.firestore.FieldValue.serverTimestamp() }); logAdminAction('Рассылка отправлена'); } };
        window.f2_clearFeed = async () => { if(confirm('Очистить ленту?')){ const snap = await db.collection('posts').get(); snap.forEach(d=>d.ref.delete()); logAdminAction('Лента очищена'); } };
        window.f3_exportDb = async () => { const snap = await db.collection('users').get(); let u=[]; snap.forEach(d=>u.push(d.data())); const b = new Blob([JSON.stringify(u,null,2)],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download='db_backup.json'; a.click(); logAdminAction('Дамп БД скачан'); };
        window.f4_toggleLock = () => { logAdminAction('Режим ЧП переключен'); alert('Режим ЧП переключен'); };
        window.f5_clearStories = async () => { const snap = await db.collection('stories').get(); snap.forEach(d=>d.ref.delete()); logAdminAction('Истории очищены'); };
        window.f6_banUser = async () => { const u=prompt('Ник для бана:'); if(u){ await db.collection('users').doc(u.toLowerCase()).update({ isBanned: true }); logAdminAction('Забанен: ' + u); loadAdminUsers(); } };
        window.f7_unbanUser = async () => { const u=prompt('Ник для разбана:'); if(u){ await db.collection('users').doc(u.toLowerCase()).update({ isBanned: false }); logAdminAction('Разбанен: ' + u); loadAdminUsers(); } };
        window.f8_muteUser = async () => { const u=prompt('Ник для мута:'); if(u){ await db.collection('users').doc(u.toLowerCase()).update({ isMuted: true }); logAdminAction('Выдан мут: ' + u); } };
        window.f16_cleanStorage = () => { 
            const session = localStorage.getItem('pulse_session');
            const theme = localStorage.getItem('pulse_theme');
            localStorage.clear();
            if (session) localStorage.setItem('pulse_session', session);
            if (theme) localStorage.setItem('pulse_theme', theme);
            logAdminAction('Сервисный кэш очищен');
            alert('Кэш приложения очищен!');
        };

        window.adminDeleteUser = async function(id) {
            if (!confirm('Удалить аккаунт ' + id + '?')) return;
            await db.collection('users').doc(id).delete();
            logAdminAction('Удален юзер: ' + id);
            loadAdminUsers();
        };

        window.copyMyCode = () => { navigator.clipboard.writeText(window.currentUser.code); alert('ID скопирован!'); };
        function showAlert(msg) { const a = document.getElementById('authAlert'); a.innerText = msg; a.classList.remove('hidden'); }
    </script>
</body>
</html>
