<!DOCTYPE html>
<html lang="ru" class="dark h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pulse Chat - Online Realtime Messenger</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#0b0f19',
                        darkCard: '#111827',
                        darkBorder: '#1f2937',
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome & Google Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #374151; border-radius: 3px; }
        button, input, textarea { -webkit-appearance: none; }
    </style>
</head>
<body class="bg-darkBg text-slate-100 h-full overflow-hidden flex flex-col select-none">

    <!-- AUTH SCREEN -->
    <div id="authScreen" class="fixed inset-0 z-50 bg-darkBg flex items-center justify-center p-4">
        <div class="w-full max-w-md bg-darkCard border border-darkBorder rounded-2xl shadow-2xl p-6 sm:p-8 flex flex-col space-y-6 relative">
            
            <!-- Language Switcher Top Right -->
            <div class="absolute top-4 right-4 flex items-center space-x-1 bg-slate-900 border border-darkBorder rounded-lg p-1 text-[11px]">
                <button type="button" onclick="setLanguage('ru')" id="langRuBtn" class="px-2 py-0.5 rounded font-semibold text-white bg-cyan-600 transition">RU</button>
                <button type="button" onclick="setLanguage('en')" id="langEnBtn" class="px-2 py-0.5 rounded font-semibold text-slate-400 hover:text-white transition">EN</button>
            </div>

            <div class="text-center space-y-2 pt-2">
                <div class="w-14 h-14 bg-cyan-600/20 border border-cyan-500/30 rounded-2xl mx-auto flex items-center justify-center text-cyan-400 text-2xl font-bold shadow-inner">
                    <i class="fa-solid fa-bolt"></i>
                </div>
                <h1 class="text-xl sm:text-2xl font-bold tracking-tight text-white">Pulse Chat</h1>
                <p id="t_subtitle" class="text-xs sm:text-sm text-slate-400">Онлайн Мессенджер в Реальном Времени</p>
            </div>

            <!-- Tabs -->
            <div class="flex bg-slate-900 p-1 rounded-xl border border-darkBorder">
                <button type="button" id="tabLoginBtn" onclick="switchAuthTab('login')" class="flex-1 py-2.5 text-xs font-semibold rounded-lg bg-cyan-600 text-white shadow-md transition-all cursor-pointer">Вход</button>
                <button type="button" id="tabRegisterBtn" onclick="switchAuthTab('register')" class="flex-1 py-2.5 text-xs font-semibold rounded-lg text-slate-400 hover:text-white transition-all cursor-pointer">Регистрация</button>
            </div>

            <!-- Alert Box -->
            <div id="authAlert" class="hidden p-3 rounded-xl bg-rose-500/10 border border-rose-500/20 text-rose-400 text-xs text-center"></div>

            <!-- Login Form -->
            <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
                <div class="space-y-1">
                    <label id="t_lbl_login_user" class="text-xs font-medium text-slate-300">Никнейм</label>
                    <input type="text" id="loginUsername" required autocomplete="username" class="w-full px-3.5 py-3 bg-slate-900 border border-darkBorder rounded-xl text-xs sm:text-sm text-white focus:outline-none focus:border-cyan-500 transition" placeholder="Введите ваш никнейм">
                </div>
                <div class="space-y-1">
                    <label id="t_lbl_login_pass" class="text-xs font-medium text-slate-300">Пароль</label>
                    <input type="password" id="loginPassword" required autocomplete="current-password" class="w-full px-3.5 py-3 bg-slate-900 border border-darkBorder rounded-xl text-xs sm:text-sm text-white focus:outline-none focus:border-cyan-500 transition" placeholder="••••••••">
                </div>
                <button type="submit" id="t_btn_login" class="w-full py-3 bg-cyan-600 hover:bg-cyan-500 active:bg-cyan-700 text-white rounded-xl text-xs sm:text-sm font-semibold shadow-lg shadow-cyan-600/20 transition-all cursor-pointer">Войти в систему</button>
            </form>

            <!-- Register Form -->
            <form id="registerForm" onsubmit="handleRegister(event)" class="space-y-4 hidden">
                <div class="space-y-1">
                    <label id="t_lbl_reg_user" class="text-xs font-medium text-slate-300">Никнейм</label>
                    <input type="text" id="regUsername" required autocomplete="username" class="w-full px-3.5 py-3 bg-slate-900 border border-darkBorder rounded-xl text-xs sm:text-sm text-white focus:outline-none focus:border-cyan-500 transition" placeholder="Придумайте никнейм">
                </div>
                <div class="space-y-1">
                    <label id="t_lbl_reg_pass" class="text-xs font-medium text-slate-300">Пароль</label>
                    <input type="password" id="regPassword" required autocomplete="new-password" class="w-full px-3.5 py-3 bg-slate-900 border border-darkBorder rounded-xl text-xs sm:text-sm text-white focus:outline-none focus:border-cyan-500 transition" placeholder="••••••••">
                </div>
                <div class="space-y-1">
                    <label id="t_lbl_reg_admin" class="text-xs font-medium text-slate-300">Ключ Администратора (опционально)</label>
                    <input type="password" id="regAdminKey" class="w-full px-3.5 py-3 bg-slate-900 border border-darkBorder rounded-xl text-xs sm:text-sm text-white focus:outline-none focus:border-cyan-500 transition" placeholder="Мастер-ключ администратора">
                </div>
                <button type="submit" id="t_btn_register" class="w-full py-3 bg-cyan-600 hover:bg-cyan-500 active:bg-cyan-700 text-white rounded-xl text-xs sm:text-sm font-semibold shadow-lg shadow-cyan-600/20 transition-all cursor-pointer">Создать аккаунт</button>
            </form>
        </div>
    </div>

    <!-- MAIN APP WRAPPER -->
    <div class="flex-1 flex overflow-hidden relative">
        <!-- SIDEBAR -->
        <div id="sidebar" class="w-72 sm:w-80 bg-darkCard border-r border-darkBorder flex flex-col h-full absolute md:relative z-30 inset-y-0 left-0 transition-transform duration-300 transform -translate-x-full md:translate-x-0 shadow-2xl md:shadow-none">
            <!-- User Profile Header -->
            <div class="p-4 border-b border-darkBorder flex items-center justify-between shrink-0">
                <div class="flex items-center space-x-3 overflow-hidden">
                    <div id="currentUserAvatar" class="w-10 h-10 rounded-xl bg-cyan-600/20 border border-cyan-500/30 flex items-center justify-center font-bold text-cyan-400 text-sm shrink-0">U</div>
                    <div class="overflow-hidden">
                        <div class="flex items-center space-x-1.5">
                            <h3 id="currentUserName" class="font-semibold text-xs text-white truncate">Пользователь</h3>
                            <span id="adminBadge" class="hidden px-1.5 py-0.5 bg-amber-500/10 border border-amber-500/30 text-amber-400 text-[9px] rounded font-semibold uppercase">Admin</span>
                        </div>
                        <button type="button" onclick="copyMyCode()" id="currentUserCode" class="text-[10px] text-slate-400 hover:text-cyan-400 transition flex items-center space-x-1 mt-0.5 truncate cursor-pointer">
                            <span>#id</span> <i class="fa-regular fa-copy text-[9px]"></i>
                        </button>
                    </div>
                </div>
                <div class="flex items-center space-x-1">
                    <!-- Language Switch Button in Header -->
                    <button type="button" onclick="toggleLanguage()" title="Switch Language" class="w-8 h-8 rounded-lg bg-slate-800 hover:bg-slate-700 text-cyan-400 font-bold text-[10px] flex items-center justify-center transition cursor-pointer">
                        <span id="langHeaderBtn">EN</span>
                    </button>
                    <button type="button" onclick="toggleAdminModal()" id="adminPanelBtn" title="Панель Администратора" class="hidden w-8 h-8 rounded-lg bg-slate-800 hover:bg-slate-700 text-amber-400 flex items-center justify-center text-xs transition cursor-pointer"><i class="fa-solid fa-shield-halved"></i></button>
                    <button type="button" onclick="logout()" title="Выйти" class="w-8 h-8 rounded-lg bg-slate-800 hover:bg-slate-700 text-rose-400 flex items-center justify-center text-xs transition cursor-pointer"><i class="fa-solid fa-right-from-bracket"></i></button>
                    <button type="button" onclick="toggleSidebar()" class="md:hidden w-8 h-8 rounded-lg bg-slate-800 text-slate-300 flex items-center justify-center text-xs cursor-pointer"><i class="fa-solid fa-xmark"></i></button>
                </div>
            </div>

            <!-- Search & Actions -->
            <div class="p-3 border-b border-darkBorder space-y-2 shrink-0">
                <div class="relative">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-slate-500 text-xs"></i>
                    <input type="text" id="chatSearchInput" oninput="filterChats()" placeholder="Поиск чатов..." class="w-full pl-8 pr-3 py-2.5 bg-slate-900 border border-darkBorder rounded-xl text-xs text-white focus:outline-none focus:border-cyan-500 transition">
                </div>
                <button type="button" onclick="openAddFriendModal()" class="w-full py-2.5 bg-cyan-600/10 hover:bg-cyan-600/20 active:bg-cyan-600/30 border border-cyan-500/30 text-cyan-400 rounded-xl text-xs font-semibold flex items-center justify-center space-x-2 transition cursor-pointer">
                    <i class="fa-solid fa-user-plus text-[11px]"></i>
                    <span id="t_btn_add_friend">Добавить чат по ID</span>
                </button>
            </div>

            <!-- Chat List -->
            <div id="chatList" class="flex-1 overflow-y-auto p-2 space-y-1">
                <!-- Chats rendered dynamically -->
            </div>
        </div>

        <!-- CHAT AREA -->
        <div class="flex-1 flex flex-col h-full bg-darkBg overflow-hidden relative z-10">
            <!-- Chat Header -->
            <div class="h-16 border-b border-darkBorder px-4 flex items-center justify-between bg-darkCard/50 backdrop-blur shrink-0">
                <div class="flex items-center space-x-3 overflow-hidden">
                    <button type="button" onclick="toggleSidebar()" class="md:hidden w-9 h-9 rounded-xl bg-slate-800 text-slate-300 flex items-center justify-center shrink-0 cursor-pointer"><i class="fa-solid fa-bars text-sm"></i></button>
                    <div id="chatAvatar" class="w-10 h-10 rounded-xl bg-slate-800 border border-darkBorder flex items-center justify-center font-bold text-white text-xs shrink-0">💬</div>
                    <div class="overflow-hidden">
                        <h3 id="chatTitle" class="font-semibold text-xs sm:text-sm text-white truncate">Выберите чат</h3>
                        <p id="chatStatus" class="text-[10px] sm:text-xs text-emerald-400 truncate">● Реальное облачное соединение</p>
                    </div>
                </div>
                <div class="flex items-center space-x-2">
                    <span id="myFriendCodeDisplay" class="hidden sm:inline-block px-2.5 py-1 bg-slate-900 border border-darkBorder rounded-lg text-[10px] text-cyan-400 font-mono">#0000</span>
                    <button type="button" onclick="clearAllData()" title="Очистить все данные" class="w-8 h-8 rounded-lg bg-slate-800 hover:bg-rose-500/20 text-slate-400 hover:text-rose-400 flex items-center justify-center text-xs transition cursor-pointer"><i class="fa-solid fa-trash-can"></i></button>
                </div>
            </div>

            <!-- Messages Container -->
            <div id="messagesContainer" class="flex-1 overflow-y-auto p-4 space-y-3">
                <!-- Messages rendered dynamically -->
            </div>

            <!-- Attachment Preview Bar -->
            <div id="attachmentPreview" class="hidden px-4 py-2 bg-darkCard border-t border-darkBorder flex items-center justify-between shrink-0">
                <div class="flex items-center space-x-2 text-xs text-cyan-400">
                    <i class="fa-solid fa-paperclip"></i>
                    <span id="attachmentName" class="truncate max-w-xs">Файл</span>
                </div>
                <button type="button" onclick="clearAttachment()" class="text-slate-400 hover:text-rose-400 text-xs cursor-pointer"><i class="fa-solid fa-xmark"></i></button>
            </div>

            <!-- Message Input Bar -->
            <div class="p-3 sm:p-4 border-t border-darkBorder bg-darkCard/50 backdrop-blur shrink-0">
                <div class="flex items-center space-x-2">
                    <label class="w-10 h-10 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 flex items-center justify-center cursor-pointer transition shrink-0">
                        <i class="fa-solid fa-paperclip text-xs"></i>
                        <input type="file" id="fileInput" onchange="handleFileSelect(event)" class="hidden">
                    </label>
                    <textarea id="messageInput" onkeydown="handleKeyDown(event)" rows="1" placeholder="Введите сообщение..." class="flex-1 px-3.5 py-2.5 bg-slate-900 border border-darkBorder rounded-xl text-xs sm:text-sm text-white focus:outline-none focus:border-cyan-500 transition resize-none max-h-24"></textarea>
                    <button type="button" onclick="sendMessage()" class="w-10 h-10 rounded-xl bg-cyan-600 hover:bg-cyan-500 active:bg-cyan-700 text-white flex items-center justify-center transition shrink-0 shadow-lg shadow-cyan-600/20 cursor-pointer"><i class="fa-solid fa-paper-plane text-xs"></i></button>
                </div>
            </div>
        </div>
    </div>

    <!-- ADD FRIEND MODAL -->
    <div id="addFriendModal" class="hidden fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="w-full max-w-sm bg-darkCard border border-darkBorder rounded-2xl shadow-2xl p-6 space-y-4">
            <div class="flex justify-between items-center">
                <h3 id="t_modal_add_title" class="font-semibold text-sm text-white">Добавить чат по ID</h3>
                <button type="button" onclick="closeAddFriendModal()" class="text-slate-400 hover:text-white cursor-pointer"><i class="fa-solid fa-xmark text-base"></i></button>
            </div>
            <form onsubmit="handleAddFriend(event)" class="space-y-4">
                <div class="space-y-1">
                    <label id="t_lbl_friend_code" class="text-xs font-medium text-slate-300">Уникальный Код Друга</label>
                    <input type="text" id="friendCodeInput" required class="w-full px-3.5 py-3 bg-slate-900 border border-darkBorder rounded-xl text-xs sm:text-sm text-white focus:outline-none focus:border-cyan-500 transition" placeholder="#username_1234">
                </div>
                <button type="submit" id="t_btn_connect" class="w-full py-3 bg-cyan-600 hover:bg-cyan-500 active:bg-cyan-700 text-white rounded-xl text-xs sm:text-sm font-semibold shadow transition cursor-pointer">Подключиться</button>
            </form>
        </div>
    </div>

    <!-- ADMIN PANEL MODAL -->
    <div id="adminModal" class="hidden fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="w-full max-w-lg bg-darkCard border border-darkBorder rounded-2xl shadow-2xl p-6 space-y-4">
            <div class="flex justify-between items-center">
                <div class="flex items-center space-x-2">
                    <i class="fa-solid fa-shield-halved text-amber-400"></i>
                    <h3 id="t_admin_title" class="font-semibold text-sm text-white">Панель Администратора (Spy Console)</h3>
                </div>
                <button type="button" onclick="toggleAdminModal()" class="text-slate-400 hover:text-white cursor-pointer"><i class="fa-solid fa-xmark text-base"></i></button>
            </div>
            <div class="space-y-3">
                <div class="space-y-1">
                    <label id="t_lbl_admin_search" class="text-xs font-medium text-slate-300">Поиск чата / пользователя для мониторинга</label>
                    <div class="flex space-x-2">
                        <input type="text" id="spyUserInput" placeholder="Введите код или имя чата..." class="flex-1 px-3.5 py-2.5 bg-slate-900 border border-darkBorder rounded-xl text-xs text-white focus:outline-none focus:border-cyan-500">
                        <button type="button" onclick="loadUserMessagesSpy()" id="t_btn_admin_find" class="px-4 py-2.5 bg-amber-600 hover:bg-amber-500 text-white rounded-xl text-xs font-semibold transition cursor-pointer">Найти</button>
                    </div>
                </div>
                <div id="spyMessagesContainer" class="h-60 overflow-y-auto bg-slate-900 border border-darkBorder rounded-xl p-3 space-y-2 text-xs text-slate-300">
                    <p id="t_admin_placeholder" class="text-slate-500 text-center py-10">Введите запрос для просмотра сообщений...</p>
                </div>
            </div>
        </div>
    </div>

    <!-- TOAST NOTIFICATIONS CONTAINER -->
    <div id="toastContainer" class="fixed bottom-5 right-5 z-50 flex flex-col space-y-2 pointer-events-none"></div>

            if (lang === 'ru') {
                if (ruBtn) ruBtn.className = "px-2 py-0.5 rounded font-semibold text-white bg-cyan-600 transition";
                if (enBtn) enBtn.className = "px-2 py-0.5 rounded font-semibold text-slate-400 hover:text-white transition";
                if (headerBtn) headerBtn.innerText = "EN";
            } else {
                if (ruBtn) ruBtn.className = "px-2 py-0.5 rounded font-semibold text-slate-400 hover:text-white transition";
                if (enBtn) enBtn.className = "px-2 py-0.5 rounded font-semibold text-white bg-cyan-600 transition";
                if (headerBtn) headerBtn.innerText = "RU";
            }

            // Update UI elements
            document.getElementById('t_subtitle').innerText = window.t('subtitle');
            document.getElementById('tabLoginBtn').innerText = window.t('tabLogin');
            document.getElementById('tabRegisterBtn').innerText = window.t('tabRegister');
            document.getElementById('t_lbl_login_user').innerText = window.t('lblLoginUser');
            document.getElementById('loginUsername').placeholder = window.t('phLoginUser');
            document.getElementById('t_lbl_login_pass').innerText = window.t('lblLoginPass');
            document.getElementById('t_btn_login').innerText = window.t('btnLogin');

            document.getElementById('t_lbl_reg_user').innerText = window.t('lblRegUser');
            document.getElementById('regUsername').placeholder = window.t('phRegUser');
            document.getElementById('t_lbl_reg_pass').innerText = window.t('lblRegPass');
            document.getElementById('t_lbl_reg_admin').innerText = window.t('lblRegAdmin');
            document.getElementById('regAdminKey').placeholder = window.t('phRegAdmin');
            document.getElementById('t_btn_register').innerText = window.t('btnRegister');

            document.getElementById('chatSearchInput').placeholder = window.t('phSearchChats');
            document.getElementById('t_btn_add_friend').innerText = window.t('btnAddFriend');
            document.getElementById('messageInput').placeholder = window.t('phMessageInput');

            document.getElementById('t_modal_add_title').innerText = window.t('modalAddTitle');
            document.getElementById('t_lbl_friend_code').innerText = window.t('lblFriendCode');
            document.getElementById('t_btn_connect').innerText = window.t('btnConnect');

            document.getElementById('t_admin_title').innerText = window.t('adminTitle');
            document.getElementById('t_lbl_admin_search').innerText = window.t('lblAdminSearch');
            document.getElementById('spyUserInput').placeholder = window.t('phAdminSearch');
            document.getElementById('t_btn_admin_find').innerText = window.t('btnAdminFind');
            
            const adminPlaceholder = document.getElementById('t_admin_placeholder');
            if (adminPlaceholder) adminPlaceholder.innerText = window.t('adminPlaceholder');

            if (window.chats && window.chats.length >= 2) {
                if (window.chats[0].id === 'saved_notes') {
                    window.chats[0].name = window.t('savedNotesName');
                    window.chats[0].status = window.t('savedNotesStatus');
                }
                if (window.chats[1].id === 'bot_pulse') {
                    window.chats[1].name = window.t('botName');
                    window.chats[1].status = window.t('botStatus');
                }
            }

            window.renderChats();
            window.selectChat(window.activeChatId);
        };

        window.toggleLanguage = function() {
            const newLang = window.currentLang === 'ru' ? 'en' : 'ru';
            window.setLanguage(newLang);
        };

        const defaultChats = [
            {
                id: 'saved_notes',
                name: 'Избранное (Заметки)',
                type: 'friend',
                avatar: '📌',
                code: '#saved_notes',
                status: 'Личный облачный чат',
                messages: [
                    { id: 1, sender: 'Система', text: translations.ru.welcomeMsg, time: getFormattedTime() }
                ]
            },
            {
                id: 'bot_pulse',
                name: 'Pulse Помощник',
                type: 'bot',
                avatar: '🤖',
                code: '#pulse_bot',
                status: 'Онлайн Бот',
                messages: [
                    { id: 2, sender: 'Pulse Помощник', text: translations.ru.botWelcomeMsg, time: getFormattedTime() }
                ]
            }
        ];

        window.chats = JSON.parse(localStorage.getItem('pulse_chat_chats') || 'null') || defaultChats;

        // AUTHENTICATION INIT
        async function initAuth() {
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
            } catch (err) {
                console.warn('Fallback anonymous auth initialized');
            }
        }

        onAuthStateChanged(auth, (user) => {
            if (user) {
                authenticatedUser = user;
                subscribeToPublicMessages();
            }
        });

        initAuth();

        // FIRESTORE REALTIME SYNC
        function subscribeToPublicMessages() {
            if (!authenticatedUser) return;
            if (unsubscribeMessages) unsubscribeMessages();

            const messagesCollection = collection(db, 'artifacts', appId, 'public', 'data', 'messages');

            unsubscribeMessages = onSnapshot(messagesCollection, (snapshot) => {
                snapshot.docChanges().forEach((change) => {
                    if (change.type === "added") {
                        const data = change.doc.data();
                        if (data && data.message && data.chatCode) {
                            handleCloudIncomingMessage(data);
                        }
                    }
                });
            }, (error) => {
                console.warn("Firestore snapshot listener alert:", error.message);
            });
        }

        function handleCloudIncomingMessage(data) {
            if (!window.currentUser) return;
            if (data.senderCode === window.currentUser.code) return; // Skip own messages

            let chat = window.chats.find(c => c.code === data.chatCode || (c.code && c.code.toLowerCase() === data.chatCode.toLowerCase()));

            if (!chat && data.receiverCode === window.currentUser.code) {
                chat = {
                    id: 'friend_' + Date.now(),
                    name: data.senderName || 'Chat (' + data.senderCode + ')',
                    type: 'friend',
                    avatar: (data.senderName || 'U').charAt(0).toUpperCase(),
                    code: data.senderCode,
                    status: '● Live Realtime',
                    messages: []
                };
                window.chats.push(chat);
            }

            if (chat) {
                if (!chat.messages) chat.messages = [];
                if (!chat.messages.some(m => m.id === data.message.id)) {
                    chat.messages.push(data.message);
                    window.saveChats();
                    window.renderChats();
                    if (window.activeChatId === chat.id) {
                        window.renderMessages();
                    } else {
                        window.showToast(window.t('newMsgFrom') + (data.senderName || 'partner'));
                    }
                }
            }
        }

        window.sendCloudMessage = async function(chatCode, receiverCode, messageData) {
            if (!authenticatedUser) return;

            try {
                const messagesCollection = collection(db, 'artifacts', appId, 'public', 'data', 'messages');
                await addDoc(messagesCollection, {
                    chatCode: chatCode,
                    receiverCode: receiverCode,
                    senderCode: window.currentUser.code,
                    senderName: window.currentUser.name,
                    message: messageData,
                    timestamp: Date.now()
                });
            } catch (err) {
                console.error("Cloud send error:", err);
            }
        };

        // UI EVENT HANDLERS
        window.addEventListener('DOMContentLoaded', () => {
            window.setLanguage(window.currentLang);

            const savedUser = localStorage.getItem('pulse_chat_session');
            if (savedUser) {
                try {
                    window.currentUser = JSON.parse(savedUser);
                    window.initUserSession(window.currentUser);
                } catch(e) {
                    localStorage.removeItem('pulse_chat_session');
                }
            }
        });

        window.showToast = function(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            if (!container) return;
            const toast = document.createElement('div');
            const bgColor = type === 'error' ? 'bg-rose-600 text-white' : type === 'success' ? 'bg-emerald-600 text-white' : 'bg-slate-800 text-slate-100 border border-slate-700';
            toast.className = `pointer-events-auto px-4 py-3 rounded-xl shadow-xl text-xs font-medium flex items-center space-x-2 transition-all duration-300 transform translate-y-2 opacity-0 ${bgColor}`;
            toast.innerHTML = `<i class="fa-solid ${type === 'error' ? 'fa-circle-exclamation' : type === 'success' ? 'fa-circle-check' : 'fa-circle-info'} text-sm"></i> <span>${escapeHtml(message)}</span>`;
            container.appendChild(toast);

            setTimeout(() => { toast.classList.remove('translate-y-2', 'opacity-0'); }, 10);
            setTimeout(() => {
                toast.classList.add('translate-y-2', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        };

        window.switchAuthTab = function(tab) {
            const loginForm = document.getElementById('loginForm');
            const registerForm = document.getElementById('registerForm');
            const tabLoginBtn = document.getElementById('tabLoginBtn');
            const tabRegisterBtn = document.getElementById('tabRegisterBtn');
            const alertBox = document.getElementById('authAlert');
            if (alertBox) alertBox.classList.add('hidden');

            if (tab === 'login') {
                loginForm.classList.remove('hidden');
                registerForm.classList.add('hidden');
                tabLoginBtn.className = "flex-1 py-2.5 text-xs font-semibold rounded-lg bg-cyan-600 text-white shadow-md transition-all cursor-pointer";
                tabRegisterBtn.className = "flex-1 py-2.5 text-xs font-semibold rounded-lg text-slate-400 hover:text-white transition-all cursor-pointer";
            } else {
                loginForm.classList.add('hidden');
                registerForm.classList.remove('hidden');
                tabRegisterBtn.className = "flex-1 py-2.5 text-xs font-semibold rounded-lg bg-cyan-600 text-white shadow-md transition-all cursor-pointer";
                tabLoginBtn.className = "flex-1 py-2.5 text-xs font-semibold rounded-lg text-slate-400 hover:text-white transition-all cursor-pointer";
            }
        };

        window.handleLogin = function(e) {
            e.preventDefault();
            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value;

            if (!username || !password) return;

            const registeredUsers = JSON.parse(localStorage.getItem('pulse_chat_users') || '{}');
            const account = registeredUsers[username.toLowerCase()];

            if (account && account.password === password) {
                localStorage.setItem('pulse_chat_session', JSON.stringify(account));
                window.initUserSession(account);
            } else {
                window.showAuthAlert(window.t('errInvalidLogin'));
            }
        };

        window.handleRegister = function(e) {
            e.preventDefault();
            const username = document.getElementById('regUsername').value.trim();
            const password = document.getElementById('regPassword').value;
            const adminKey = document.getElementById('regAdminKey').value.trim();

            if (!username || !password) return;

            const registeredUsers = JSON.parse(localStorage.getItem('pulse_chat_users') || '{}');
            const userKey = username.toLowerCase();

            if (registeredUsers[userKey]) {
                window.showAuthAlert(window.t('errUserExists'));
                return;
            }

            const isAdmin = (adminKey === window.MASTER_ADMIN_KEY);

            const newUser = {
                id: 'usr_' + Date.now(),
                name: username,
                code: '#' + username + '_' + Math.floor(1000 + Math.random() * 9000),
                password: password,
                isAdmin: isAdmin,
                role: isAdmin ? 'ADMIN' : 'USER',
                avatar: username.charAt(0).toUpperCase()
            };

            registeredUsers[userKey] = newUser;
            localStorage.setItem('pulse_chat_users', JSON.stringify(registeredUsers));
            localStorage.setItem('pulse_chat_session', JSON.stringify(newUser));

            window.initUserSession(newUser);
        };

        window.showAuthAlert = function(msg) {
            const alertBox = document.getElementById('authAlert');
            if (alertBox) {
                alertBox.textContent = msg;
                alertBox.classList.remove('hidden');
            }
        };

        window.normalizeCode = function(code) {
            if (!code) return '';
            code = code.trim();
            if (!code.startsWith('#')) code = '#' + code;
            return code;
        };

        window.initUserSession = function(user) {
            window.currentUser = user;
            const authScreen = document.getElementById('authScreen');
            if (authScreen) authScreen.classList.add('hidden');

            document.getElementById('currentUserName').innerText = user.name;
            document.getElementById('currentUserAvatar').innerText = user.avatar;
            document.getElementById('currentUserCode').innerHTML = `<span>${user.code}</span> <i class="fa-regular fa-copy text-[10px]"></i>`;
            document.getElementById('myFriendCodeDisplay').innerText = user.code;

            if (user.isAdmin === true || user.role === 'ADMIN') {
                document.getElementById('adminBadge').classList.remove('hidden');
                document.getElementById('adminPanelBtn').classList.remove('hidden');
            } else {
                document.getElementById('adminBadge').classList.add('hidden');
                document.getElementById('adminPanelBtn').classList.add('hidden');
            }

            window.renderChats();
            window.selectChat(window.activeChatId);
            window.showToast(window.t('toastAuthSuccess'), 'success');
        };

        window.sendMessage = function() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();

            if (!text && !window.selectedAttachment) return;

            const newMessage = {
                id: Date.now(),
                sender: window.currentUser.name,
                text: text,
                file: window.selectedAttachment,
                time: getFormattedTime()
            };

            let chat = window.chats.find(c => c.id === window.activeChatId);
            if (!chat) {
                chat = window.chats[0];
                window.activeChatId = chat.id;
            }

            if (!chat.messages) chat.messages = [];
            chat.messages.push(newMessage);
            window.saveChats();
            window.renderMessages();
            window.renderChats();

            // Send Realtime Cloud Message
            if (chat.type === 'friend' && chat.code && chat.code !== '#saved_notes') {
                window.sendCloudMessage(chat.code, chat.code, newMessage);
            }

            if (chat.type === 'bot') {
                setTimeout(() => {
                    chat.messages.push({
                        id: Date.now() + 1,
                        sender: chat.name,
                        text: `${window.t('botResponsePrefix')} ("${text || 'file'}"). ${window.t('botResponseSuffix')}`,
                        time: getFormattedTime()
                    });
                    window.saveChats();
                    if (window.activeChatId === chat.id) window.renderMessages();
                    window.renderChats();
                }, 400);
            }

            input.value = '';
            window.clearAttachment();
        };

        window.renderMessages = function() {
            const container = document.getElementById('messagesContainer');
            if (!container) return;
            container.innerHTML = '';

            const chat = window.chats.find(c => c.id === window.activeChatId);
            if (!chat || !chat.messages || chat.messages.length === 0) {
                container.innerHTML = `<div class="flex flex-col items-center justify-center h-full text-slate-500 space-y-2"> <i class="fa-regular fa-comments text-4xl opacity-20"></i> <p class="text-xs text-center">${window.t('noMessages')}</p> </div>`;
                return;
            }

            chat.messages.forEach(msg => {
                const isMe = msg.sender === window.currentUser?.name;
                const wrapper = document.createElement('div');
                wrapper.className = `flex flex-col ${isMe ? 'items-end' : 'items-start'} space-y-1`;

                let contentHtml = '';
                if (msg.text) {
                    contentHtml += `<p class="leading-relaxed whitespace-pre-wrap break-words">${escapeHtml(msg.text)}</p>`;
                }
                if (msg.file) {
                    if (msg.file.type && msg.file.type.startsWith('image/')) {
                        contentHtml += `<img src="${msg.file.data}" class="max-w-xs rounded-lg mt-1 border border-slate-700">`;
                    } else {
                        contentHtml += `<a href="${msg.file.data}" download="${msg.file.name}" class="flex items-center space-x-2 mt-1 p-2 bg-slate-800 rounded-lg text-cyan-400 text-xs"> <i class="fa-solid fa-file-arrow-down"></i> <span class="underline truncate">${msg.file.name}</span> </a>`;
                    }
                }

                wrapper.innerHTML = `<div class="max-w-[85%] md:max-w-[70%] px-3.5 py-2 rounded-2xl text-xs md:text-sm ${isMe ? 'bg-cyan-600 text-white rounded-br-none shadow-md' : 'bg-slate-800 text-slate-100 rounded-bl-none border border-slate-700/50'}"> ${contentHtml} <div class="text-[9px] ${isMe ? 'text-cyan-200' : 'text-slate-400'} text-right mt-1"> ${msg.time} </div> </div>`;
                container.appendChild(wrapper);
            });

            container.scrollTop = container.scrollHeight;
        };

        window.renderChats = function() {
            const chatListEl = document.getElementById('chatList');
            if (!chatListEl) return;
            chatListEl.innerHTML = '';

            window.chats.forEach(chat => {
                const lastMsg = chat.messages ? chat.messages[chat.messages.length - 1] : null;
                const lastMsgText = lastMsg ? (lastMsg.text || 'Media File') : 'No messages';
                const lastMsgTime = lastMsg ? lastMsg.time : '';

                const isActive = chat.id === window.activeChatId;
                const item = document.createElement('div');
                item.className = `p-2.5 rounded-xl cursor-pointer transition flex items-center space-x-3 ${isActive ? 'bg-cyan-600/20 border border-cyan-500/30' : 'hover:bg-slate-800/50'}`;
                item.onclick = () => window.selectChat(chat.id);

                item.innerHTML = `<div class="w-9 h-9 rounded-xl bg-slate-800 border border-slate-700 flex items-center justify-center font-bold text-white text-xs shrink-0 uppercase"> ${chat.avatar} </div> <div class="flex-1 overflow-hidden"> <div class="flex justify-between items-center mb-0.5"> <h4 class="font-semibold text-slate-200 text-xs truncate">${chat.name}</h4> <span class="text-[10px] text-slate-500">${lastMsgTime}</span> </div> <p class="text-[11px] text-slate-400 truncate">${escapeHtml(lastMsgText)}</p> </div>`;
                chatListEl.appendChild(item);
            });
        };

        window.selectChat = function(id) {
            window.activeChatId = id;
            const chat = window.chats.find(c => c.id === id);
            if (!chat) return;

            document.getElementById('chatTitle').innerText = chat.name;
            document.getElementById('chatStatus').innerText = chat.status || window.t('statusRealtime');
            document.getElementById('chatAvatar').innerText = chat.avatar;

            window.renderMessages();
            window.renderChats();

            if (window.innerWidth < 768) {
                const sidebar = document.getElementById('sidebar');
                if (sidebar) sidebar.classList.add('-translate-x-full');
            }
        };

        window.toggleAdminModal = function() {
            if (!window.currentUser || (!window.currentUser.isAdmin && window.currentUser.role !== 'ADMIN')) {
                window.showToast(window.t('toastNoAdmin'), 'error');
                return;
            }
            const modal = document.getElementById('adminModal');
            if (modal) modal.classList.toggle('hidden');
        };

        window.loadUserMessagesSpy = function() {
            const query = document.getElementById('spyUserInput').value.trim().toLowerCase();
            const spyContainer = document.getElementById('spyMessagesContainer');
            if (!spyContainer) return;
            spyContainer.innerHTML = '';

            if (!query) return;

            const chat = window.chats.find(c => c.code && c.code.toLowerCase().includes(query) || c.name.toLowerCase().includes(query) || c.id === query);
            if (!chat || !chat.messages || chat.messages.length === 0) {
                spyContainer.innerHTML = `<p class="text-rose-400 text-center text-[11px]">${window.t('dialogNotFound')}</p>`;
                return;
            }

            chat.messages.forEach(m => {
                const row = document.createElement('div');
                row.className = 'p-1.5 rounded bg-slate-950 border border-slate-800 text-[11px]';
                row.innerHTML = `<strong class="text-amber-400">${m.sender}:</strong> <span class="text-slate-200">${escapeHtml(m.text || '[File]')}</span> <span class="text-slate-500 text-[9px] float-right">${m.time}</span>`;
                spyContainer.appendChild(row);
            });
        };

        window.openAddFriendModal = function() {
            const modal = document.getElementById('addFriendModal');
            if (modal) modal.classList.remove('hidden');
        };

        window.closeAddFriendModal = function() {
            const modal = document.getElementById('addFriendModal');
            if (modal) modal.classList.add('hidden');
        };

        window.handleAddFriend = function(e) {
            e.preventDefault();
            const codeInput = window.normalizeCode(document.getElementById('friendCodeInput').value);
            if (!codeInput) return;

            if (codeInput === window.currentUser.code) {
                window.showToast(window.t('toastAddSelf'), 'error');
                return;
            }

            let chat = window.chats.find(c => c.code === codeInput);
            if (!chat) {
                chat = {
                    id: 'friend_' + Date.now(),
                    name: 'Chat (' + codeInput + ')',
                    type: 'friend',
                    avatar: '👤',
                    code: codeInput,
                    status: window.t('statusRealtime'),
                    messages: [
                        { id: Date.now(), sender: 'System', text: 'Chat created. Cloud connection established.', time: getFormattedTime() }
                    ]
                };
                window.chats.push(chat);
                window.saveChats();
            }

            window.renderChats();
            window.selectChat(chat.id);
            window.closeAddFriendModal();
            window.showToast(window.t('toastChatAdded'), 'success');
        };

        window.handleKeyDown = function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                window.sendMessage();
            }
        };

        window.handleFileSelect = function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(evt) {
                window.selectedAttachment = {
                    name: file.name,
                    type: file.type,
                    data: evt.target.result
                };
                document.getElementById('attachmentName').innerText = file.name;
                document.getElementById('attachmentPreview').classList.remove('hidden');
            };
            reader.readAsDataURL(file);
        };

        window.clearAttachment = function() {
            window.selectedAttachment = null;
            document.getElementById('attachmentPreview').classList.add('hidden');
            document.getElementById('fileInput').value = '';
        };

        window.saveChats = function() {
            localStorage.setItem('pulse_chat_chats', JSON.stringify(window.chats));
        };

        window.logout = function() {
            localStorage.removeItem('pulse_chat_session');
            window.currentUser = null;
            document.getElementById('authScreen').classList.remove('hidden');
        };

        function getFormattedTime() {
            const now = new Date();
            return `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
        }

        window.toggleSidebar = function() {
            const sidebar = document.getElementById('sidebar');
            if (sidebar) sidebar.classList.toggle('-translate-x-full');
        };

        window.copyMyCode = function() {
            if (!window.currentUser) return;
            const textArea = document.createElement('textarea');
            textArea.value = window.currentUser.code;
            textArea.style.position = 'fixed';
            textArea.style.opacity = '0';
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            try {
                document.execCommand('copy');
                window.showToast(window.t('toastIdCopied') + window.currentUser.code, 'success');
            } catch (err) {
                window.showToast(window.t('toastIdCopyError'), 'error');
            }
            document.body.removeChild(textArea);
        };

        window.clearAllData = function() {
            localStorage.clear();
            location.reload();
        };

        window.filterChats = function() {
            const q = document.getElementById('chatSearchInput').value.toLowerCase();
            const items = document.getElementById('chatList').children;
            for (let item of items) {
                const text = item.innerText.toLowerCase();
                item.style.display = text.includes(q) ? 'flex' : 'none';
            }
        };

        function escapeHtml(text) {
            if (!text) return '';
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
